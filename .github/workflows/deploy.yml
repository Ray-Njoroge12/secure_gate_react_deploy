name: Deploy

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target environment (staging or production)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            secure-gate-access/server/package-lock.json

      - name: Build and test
        run: secure-gate-access/scripts/ci/build.sh

  deploy-staging:
    needs: build-test
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to staging and run smoke tests
        env:
          DEPLOY_ENV: staging
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
          EB_APP: ${{ secrets.EB_APP }}
          EB_ENV: ${{ secrets.EB_ENV }}
          EB_VERSION_LABEL: ${{ secrets.EB_VERSION_LABEL }}
          SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          SMOKE_LOGIN_EMAIL: ${{ secrets.STAGING_SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.STAGING_SMOKE_LOGIN_PASSWORD }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.STAGING_SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.STAGING_SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_TOKEN: ${{ secrets.STAGING_SMOKE_ADMIN_TOKEN }}
        run: secure-gate-access/scripts/ci/deploy.sh

  deploy-production:
    needs: deploy-staging
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to production and run smoke tests
        env:
          DEPLOY_ENV: production
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
          EB_APP: ${{ secrets.EB_APP }}
          EB_ENV: ${{ secrets.EB_ENV }}
          EB_VERSION_LABEL: ${{ secrets.EB_VERSION_LABEL }}
          SMOKE_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          SMOKE_LOGIN_EMAIL: ${{ secrets.PROD_SMOKE_LOGIN_EMAIL }}
          SMOKE_LOGIN_PASSWORD: ${{ secrets.PROD_SMOKE_LOGIN_PASSWORD }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.PROD_SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.PROD_SMOKE_ADMIN_PASSWORD }}
          SMOKE_ADMIN_TOKEN: ${{ secrets.PROD_SMOKE_ADMIN_TOKEN }}
        run: secure-gate-access/scripts/ci/deploy.sh
