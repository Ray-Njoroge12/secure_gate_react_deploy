name: Security Scanning

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM

jobs:
  # Prevent reintroduction of duplicated core infra resources
  infra-boundary-guard:
    name: Infrastructure Boundary Guard
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Self-test boundary checker
      run: |
        temp_file="secure-gate-access/infrastructure/aws/.infra-boundary-selftest.yaml"

        cat > "$temp_file" <<'EOF'
        AWSTemplateFormatVersion: '2010-09-09'
        Resources:
          ExampleVPC:
            Type: AWS::EC2::VPC
            Properties:
              CidrBlock: 10.1.0.0/16
        EOF

        if bash .github/scripts/check-infra-boundary.sh; then
          rm -f "$temp_file"
          echo "Boundary checker self-test failed: expected detection did not occur."
          exit 1
        fi

        rm -f "$temp_file"
        echo "Boundary checker self-test passed."

    - name: Run infrastructure boundary check
      run: |
        bash .github/scripts/check-infra-boundary.sh

  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.11'

    - name: Install dependencies
      run: |
        npm --prefix secure-gate-access/client ci --legacy-peer-deps
        npm --prefix secure-gate-access/server ci

    - name: Run npm audit
      run: |
        echo "Scanning frontend dependencies..."
        cd secure-gate-access/client && npm audit --audit-level=high
        echo "Scanning backend dependencies..."
        cd ../server && npm audit --audit-level=high
      continue-on-error: true

  # Code quality and security analysis
  code-analysis:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.11'

    - name: Install client dependencies
      run: npm --prefix secure-gate-access/client ci --legacy-peer-deps

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript

    - name: Autobuild for CodeQL
      uses: github/codeql-action/autobuild@v3

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Run ESLint security rules
      run: |
        cd secure-gate-access/client
        npm install -g eslint-plugin-security
        npx eslint . --ext .js,.jsx --config .eslintrc.security.js || echo "ESLint security scan completed"

    - name: Run Semgrep security analysis
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten

  # Infrastructure security scanning
  infrastructure-scan:
    name: Infrastructure Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Checkov for infrastructure security
      uses: bridgecrewio/checkov-action@master
      with:
        directory: infra/
        framework: terraform,cloudformation
        output_format: sarif
        output_file_path: checkov-results.sarif

    - name: Upload Checkov results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-results.sarif

  # Secret scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run TruffleHog secret scanner
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        head: ${{ github.sha }}
        extra_args: --debug --only-verified
      continue-on-error: true

    - name: Run GitLeaks secret scanner
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

  # Security report generation
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [infra-boundary-guard, dependency-scan, code-analysis, infrastructure-scan, secret-scan]
    if: always()
    
    steps:
    - name: Generate security report
      run: |
        echo "# Security Scan Report" > security-report.md
        echo "Generated on: $(date)" >> security-report.md
        echo "" >> security-report.md
        echo "## Scan Results Summary" >> security-report.md
        echo "- Infrastructure Boundary Guard: ${{ needs.infra-boundary-guard.result }}" >> security-report.md
        echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
        echo "- Code Analysis: ${{ needs.code-analysis.result }}" >> security-report.md
        echo "- Infrastructure Scan: ${{ needs.infrastructure-scan.result }}" >> security-report.md
        echo "- Secret Scan: ${{ needs.secret-scan.result }}" >> security-report.md
        echo "" >> security-report.md
        echo "## Recommendations" >> security-report.md
        echo "1. Review and address any high-severity vulnerabilities" >> security-report.md
        echo "2. Update dependencies with known vulnerabilities" >> security-report.md
        echo "3. Implement security best practices in code" >> security-report.md
        echo "4. Regular security scanning and monitoring" >> security-report.md

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
        retention-days: 30

    - name: Comment PR with security report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('security-report.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
