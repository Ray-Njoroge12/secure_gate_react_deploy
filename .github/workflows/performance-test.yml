name: Performance Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test'
        required: true
        type: choice
        options:
        - load
        - stress
        - spike
        - volume
      duration:
        description: 'Test duration in minutes'
        required: false
        default: '5'
        type: string

jobs:
  # Setup test environment
  setup-environment:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start test environment
      run: |
        cd deployment
        # Start blue environment for testing
        ./blue-green-deploy.sh deploy blue

    - name: Wait for services to be ready
      run: |
        sleep 30
        curl -f http://localhost:8080/health || exit 1
        curl -f http://localhost:5001/health || exit 1

  # Load testing
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'load' || github.event.inputs.test_type == '' || github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup k6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Create k6 load test script
      run: |
        cat > load-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export let options = {
          stages: [
            { duration: '2m', target: 10 }, // Ramp up to 10 users
            { duration: '5m', target: 10 }, // Stay at 10 users
            { duration: '2m', target: 0 },  // Ramp down to 0 users
          ],
          thresholds: {
            http_req_duration: ['p(95)<2000'], // 95% of requests must complete below 2s
            http_req_failed: ['rate<0.1'],     // Error rate must be below 10%
          },
        };

        export default function() {
          // Test health endpoints
          let healthResponse = http.get('http://localhost:8080/health');
          check(healthResponse, {
            'health endpoint status is 200': (r) => r.status === 200,
            'health endpoint response time < 500ms': (r) => r.timings.duration < 500,
          });

          // Test API endpoints
          let apiResponse = http.get('http://localhost:5001/health');
          check(apiResponse, {
            'API endpoint status is 200': (r) => r.status === 200,
            'API endpoint response time < 1000ms': (r) => r.timings.duration < 1000,
          });

          // Test frontend
          let frontendResponse = http.get('http://localhost:3001/');
          check(frontendResponse, {
            'frontend status is 200': (r) => r.status === 200,
            'frontend response time < 2000ms': (r) => r.timings.duration < 2000,
          });

          sleep(1);
        }
        EOF

    - name: Run load test
      run: k6 run load-test.js

  # Stress testing
  stress-test:
    name: Stress Testing
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'stress'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup k6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Create k6 stress test script
      run: |
        cat > stress-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export let options = {
          stages: [
            { duration: '1m', target: 10 },  // Ramp up to 10 users
            { duration: '2m', target: 50 },  // Ramp up to 50 users
            { duration: '3m', target: 100 }, // Ramp up to 100 users
            { duration: '2m', target: 0 },   // Ramp down to 0 users
          ],
          thresholds: {
            http_req_duration: ['p(95)<5000'], // 95% of requests must complete below 5s
            http_req_failed: ['rate<0.2'],     // Error rate must be below 20%
          },
        };

        export default function() {
          let healthResponse = http.get('http://localhost:8080/health');
          check(healthResponse, {
            'health endpoint status is 200': (r) => r.status === 200,
          });

          let apiResponse = http.get('http://localhost:5001/health');
          check(apiResponse, {
            'API endpoint status is 200': (r) => r.status === 200,
          });

          sleep(0.5);
        }
        EOF

    - name: Run stress test
      run: k6 run stress-test.js

  # Spike testing
  spike-test:
    name: Spike Testing
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'spike'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup k6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Create k6 spike test script
      run: |
        cat > spike-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export let options = {
          stages: [
            { duration: '1m', target: 10 },   // Normal load
            { duration: '30s', target: 200 }, // Sudden spike
            { duration: '1m', target: 10 },   // Back to normal
            { duration: '30s', target: 300 }, // Another spike
            { duration: '1m', target: 0 },    // Ramp down
          ],
          thresholds: {
            http_req_duration: ['p(95)<10000'], // 95% of requests must complete below 10s
            http_req_failed: ['rate<0.3'],      // Error rate must be below 30%
          },
        };

        export default function() {
          let healthResponse = http.get('http://localhost:8080/health');
          check(healthResponse, {
            'health endpoint status is 200': (r) => r.status === 200,
          });

          let apiResponse = http.get('http://localhost:5001/health');
          check(apiResponse, {
            'API endpoint status is 200': (r) => r.status === 200,
          });

          sleep(0.1);
        }
        EOF

    - name: Run spike test
      run: k6 run spike-test.js

  # Volume testing
  volume-test:
    name: Volume Testing
    runs-on: ubuntu-latest
    needs: setup-environment
    if: github.event.inputs.test_type == 'volume'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup k6
      run: |
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Create k6 volume test script
      run: |
        cat > volume-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export let options = {
          stages: [
            { duration: '2m', target: 20 },   // Ramp up to 20 users
            { duration: '10m', target: 20 },  // Stay at 20 users for extended period
            { duration: '2m', target: 0 },    // Ramp down
          ],
          thresholds: {
            http_req_duration: ['p(95)<3000'], // 95% of requests must complete below 3s
            http_req_failed: ['rate<0.1'],     // Error rate must be below 10%
          },
        };

        export default function() {
          let healthResponse = http.get('http://localhost:8080/health');
          check(healthResponse, {
            'health endpoint status is 200': (r) => r.status === 200,
          });

          let apiResponse = http.get('http://localhost:5001/health');
          check(apiResponse, {
            'API endpoint status is 200': (r) => r.status === 200,
          });

          sleep(1);
        }
        EOF

    - name: Run volume test
      run: k6 run volume-test.js

  # Performance report generation
  performance-report:
    name: Generate Performance Report
    runs-on: ubuntu-latest
    needs: [load-test, stress-test, spike-test, volume-test]
    if: always()
    
    steps:
    - name: Generate performance report
      run: |
        echo "# Performance Test Report" > performance-report.md
        echo "Generated on: $(date)" >> performance-report.md
        echo "" >> performance-report.md
        echo "## Test Results Summary" >> performance-report.md
        echo "- Load Test: ${{ needs.load-test.result }}" >> performance-report.md
        echo "- Stress Test: ${{ needs.stress-test.result }}" >> performance-report.md
        echo "- Spike Test: ${{ needs.spike-test.result }}" >> performance-report.md
        echo "- Volume Test: ${{ needs.volume-test.result }}" >> performance-report.md
        echo "" >> performance-report.md
        echo "## Performance Metrics" >> performance-report.md
        echo "- Response Time (95th percentile): < 2s" >> performance-report.md
        echo "- Error Rate: < 10%" >> performance-report.md
        echo "- Throughput: Measured during tests" >> performance-report.md
        echo "" >> performance-report.md
        echo "## Recommendations" >> performance-report.md
        echo "1. Monitor response times under load" >> performance-report.md
        echo "2. Implement caching strategies" >> performance-report.md
        echo "3. Optimize database queries" >> performance-report.md
        echo "4. Consider horizontal scaling" >> performance-report.md

    - name: Upload performance report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: performance-report.md
        retention-days: 30

  # Cleanup
  cleanup:
    name: Cleanup Test Environment
    runs-on: ubuntu-latest
    needs: [load-test, stress-test, spike-test, volume-test, performance-report]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cleanup test environment
      run: |
        cd deployment
        ./blue-green-deploy.sh cleanup
