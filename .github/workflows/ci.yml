name: CI

on:
  push:
    branches: [ main, master, develop, temp-*, feature/* ]
  pull_request:
    branches: [ "**" ]

jobs:
  server-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securegate
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Database connection for the server and psql client
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: securegate
      # Disable external notifications in CI
      ENABLE_EMAIL_NOTIFICATIONS: "false"
      ENABLE_SMS_NOTIFICATIONS: "false"
      OTP_DEBUG_ECHO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            secure-gate-access/server/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            secure-gate-access/server/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: secure-gate-access/server
        run: npm ci

      - name: Create .env for server
        working-directory: secure-gate-access/server
        run: |
          cp .env.example .env
          echo "PGHOST=localhost" >> .env
          echo "PGPORT=5432" >> .env
          echo "PGUSER=postgres" >> .env
          echo "PGPASSWORD=postgres" >> .env
          echo "PGDATABASE=securegate" >> .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "ENABLE_EMAIL_NOTIFICATIONS=false" >> .env
          echo "ENABLE_SMS_NOTIFICATIONS=false" >> .env
          echo "OTP_DEBUG_ECHO=true" >> .env

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; then
              echo "Postgres is ready";
              break;
            fi
            echo "Waiting for Postgres...";
            sleep 2;
          done

      - name: Initialize database schema
        working-directory: secure-gate-access/server
        run: npm run db:init

      - name: Apply SQL migrations
        working-directory: secure-gate-access/server
        run: |
          set -e
          shopt -s nullglob
          for f in migrations/*.sql; do
            echo "Applying migration: $f"
            psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -f "$f"
          done

      - name: Run critical flow tests
        working-directory: secure-gate-access/server
        run: npm run test:critical

      - name: Run server tests
        working-directory: secure-gate-access/server
        run: npm test
