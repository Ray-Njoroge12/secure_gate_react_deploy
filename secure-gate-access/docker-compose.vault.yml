# Vault Configuration for Secure Gate Access Control System
# HashiCorp Vault with HA mode and integrated secrets management

version: '3.8'

services:
  # Vault Server (HA Mode)
  vault:
    image: vault:1.15.2
    container_name: secure-gate-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-SG2024!VaultRootTokenForSecureGate}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_CLUSTER_ADDR: http://vault:8201
      VAULT_UI: true
      VAULT_LOG_LEVEL: info
    ports:
      - "8200:8200"
      - "8201:8201"
    volumes:
      - vault_data:/vault/data
      - vault_config:/vault/config
      - ./vault/config:/vault/config:ro
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - secure-gate-network
      - vault-network

  # Vault Agent (for application integration)
  vault-agent:
    image: vault:1.15.2
    container_name: secure-gate-vault-agent
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_AGENT_TOKEN:-SG2024!VaultAgentTokenForSecureGate}
    volumes:
      - ./vault/agent:/vault/config:ro
      - vault_secrets:/vault/secrets
    command: ["vault", "agent", "-config=/vault/config/agent.hcl"]
    restart: unless-stopped
    networks:
      - secure-gate-network
      - vault-network

  # Consul (for Vault HA backend)
  consul:
    image: consul:1.16.1
    container_name: secure-gate-consul
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - consul_data:/consul/data
      - ./consul/config:/consul/config:ro
    command: ["consul", "agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0", "-config-dir=/consul/config"]
    ports:
      - "8500:8500"
    restart: unless-stopped
    networks:
      - vault-network

  # Vault Initialization Service
  vault-init:
    image: vault:1.15.2
    container_name: secure-gate-vault-init
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-SG2024!VaultRootTokenForSecureGate}
    volumes:
      - ./vault/scripts:/vault/scripts:ro
    command: ["sh", "/vault/scripts/init-vault.sh"]
    restart: "no"
    networks:
      - secure-gate-network
      - vault-network

# Named volumes for data persistence
volumes:
  vault_data:
    driver: local
  vault_config:
    driver: local
  vault_secrets:
    driver: local
  consul_data:
    driver: local

# Networks
networks:
  secure-gate-network:
    external: true
  vault-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
