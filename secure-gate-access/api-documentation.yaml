openapi: 3.0.3
info:
  title: Secure Gate Access API
  description: |
    Comprehensive API for visitor management system with role-based access control and enhanced user functionality refinements.
    
    ## Authentication
    This API uses JWT Bearer tokens for authentication. Include the token in the Authorization header:
    `Authorization: Bearer <your_jwt_token>`
    
    ## Enhanced Features (v3.0)
    - **Performance Optimization**: Sub-200ms response times with intelligent caching
    - **Advanced Notifications**: Smart routing with user preferences and quiet hours
    - **Bulk Operations**: Efficient multi-item processing with progress tracking
    - **Advanced Search**: Real-time suggestions with complex filtering
    - **Data Export**: Multi-format reporting with scheduled delivery
    - **Webhook Integration**: Real-time event notifications with retry logic
    - **Enhanced Security**: MFA support and comprehensive audit logging
    
    ## User Roles
    - **super_admin**: Platform-wide access across all estates
    - **admin**: Complete estate management and configuration
    - **guard**: Visitor processing and security operations
    - **resident**: Visitor invitation and management
    - **visitor**: Self-service access via secure tokens
    
    ## Performance Targets
    - **UI Feedback**: <200ms response time
    - **Data Operations**: <2s response time
    - **Throughput**: 1000+ requests per minute
    - **Availability**: 99.9% uptime target
    
  version: 3.0.0
  contact:
    name: Secure Gate Access Team
    email: support@securegate.com
  license:
    name: MIT

servers:
  - url: http://localhost:5000/api
    description: Development server
  - url: https://api.securegate.com/api
    description: Production server

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [resident, guard, admin]
        area:
          type: string
        phone:
          type: string
        house:
          type: string
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      required: [username, email, role]

    Visitor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        id_number:
          type: string
        vehicle_plate:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, ON_PREMISE, EXITED, REVOKED, EXPIRED]
        host_email:
          type: string
        date_of_visit:
          type: string
          format: date
        time:
          type: string
        purpose:
          type: string
        otp:
          type: string
        otp_expires_at:
          type: string
          format: date-time
        check_in_time:
          type: string
          format: date-time
        check_out_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [name, status, host_email]

    UserPreferences:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        dashboard_layout:
          type: object
          description: Customizable dashboard widget layout
        theme:
          type: string
          enum: [light, dark, auto, high-contrast]
        density:
          type: string
          enum: [compact, comfortable, spacious]
        notifications:
          type: object
          properties:
            channels:
              type: object
              properties:
                email:
                  type: boolean
                sms:
                  type: boolean
                push:
                  type: boolean
                in_app:
                  type: boolean
            quiet_hours:
              type: object
              properties:
                enabled:
                  type: boolean
                start:
                  type: string
                  format: time
                end:
                  type: string
                  format: time
        accessibility:
          type: object
          properties:
            screen_reader:
              type: boolean
            high_contrast:
              type: boolean
            large_text:
              type: boolean
            reduced_motion:
              type: boolean

    BulkOperation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [visitor_approval, user_management, data_export, notification_broadcast]
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        progress:
          type: number
          minimum: 0
          maximum: 100
        total_items:
          type: integer
        processed_items:
          type: integer
        results:
          type: object
          properties:
            success:
              type: array
            failed:
              type: array
            skipped:
              type: array
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    NotificationPreference:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        notification_type:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [email, sms, push, in_app]
        frequency:
          type: string
          enum: [immediate, hourly, daily, weekly]
        enabled:
          type: boolean

    IntelligentNotificationPreferences:
      type: object
      properties:
        emailEnabled:
          type: boolean
          description: Enable email notifications
        smsEnabled:
          type: boolean
          description: Enable SMS notifications
        pushEnabled:
          type: boolean
          description: Enable push notifications
        notifyOnInvite:
          type: boolean
          description: Notify when visitor is invited
        notifyOnApproval:
          type: boolean
          description: Notify when visitor is approved
        notifyOnRejection:
          type: boolean
          description: Notify when visitor is rejected
        notifyOnCheckin:
          type: boolean
          description: Notify when visitor checks in
        notifyOnCheckout:
          type: boolean
          description: Notify when visitor checks out
        notifyOnReminder:
          type: boolean
          description: Enable reminder notifications
        notifySecurityAlerts:
          type: boolean
          description: Enable security alert notifications
        quietHoursStart:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          description: Quiet hours start time (HH:MM format)
        quietHoursEnd:
          type: string
          pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
          description: Quiet hours end time (HH:MM format)
        language:
          type: string
          default: 'en'
          description: Preferred language for notifications

    NotificationBehavior:
      type: object
      properties:
        notificationType:
          type: string
          description: Type of notification
        deliveredCount:
          type: integer
          description: Number of notifications delivered
        dismissedCount:
          type: integer
          description: Number of notifications dismissed
        clickedCount:
          type: integer
          description: Number of notifications clicked
        relevanceScore:
          type: number
          format: float
          description: AI-calculated relevance score
        lastUpdated:
          type: string
          format: date-time
          description: Last behavior update timestamp

    NotificationStatistics:
      type: object
      properties:
        notificationType:
          type: string
          description: Type of notification
        totalCount:
          type: integer
          description: Total notifications sent
        sentCount:
          type: integer
          description: Successfully sent notifications
        failedCount:
          type: integer
          description: Failed notifications
        readCount:
          type: integer
          description: Read notifications
        deliveryRate:
          type: string
          description: Delivery success rate percentage
        readRate:
          type: string
          description: Read rate percentage

    NotificationAnalytics:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalNotifications:
              type: integer
            successfulNotifications:
              type: integer
            failedNotifications:
              type: integer
            deliveryRate:
              type: string
            period:
              type: string
        delivery:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              notificationType:
                type: string
              channel:
                type: string
              count:
                type: integer
              successful:
                type: integer
              failed:
                type: integer
              successRate:
                type: string
        engagement:
          type: array
          items:
            $ref: '#/components/schemas/NotificationBehavior'
        hourlyDistribution:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
              notificationsSent:
                type: integer
              notificationsRead:
                type: integer
              readRate:
                type: string

    NotificationHistoryItem:
      type: object
      properties:
        id:
          type: string
          description: Notification ID
        type:
          type: string
          description: Notification type
        title:
          type: string
          description: Notification title
        message:
          type: string
          description: Notification message
        status:
          type: string
          enum: [pending, sent, failed, delivered, read]
          description: Notification status
        channels:
          type: array
          items:
            type: string
          description: Delivery channels used
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: Notification priority
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        readAt:
          type: string
          format: date-time
          description: Read timestamp (if read)

    NotificationInsights:
      type: object
      properties:
        userBehavior:
          type: array
          items:
            type: object
            properties:
              notificationType:
                type: string
              deliveredCount:
                type: integer
              dismissedCount:
                type: integer
              clickedCount:
                type: integer
              relevanceScore:
                type: number
              engagementRate:
                type: string
        deliveryPatterns:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
              dayOfWeek:
                type: integer
              notificationCount:
                type: integer
              readCount:
                type: integer
              readRate:
                type: string
        channelEffectiveness:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
              totalSent:
                type: integer
              totalRead:
                type: integer
              totalClicked:
                type: integer
              readRate:
                type: string
              clickRate:
                type: string
        recommendations:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [engagement, timing, channel, volume]
              priority:
                type: string
                enum: [low, medium, high]
              title:
                type: string
              description:
                type: string
              action:
                type: string

    NotificationSystemHealth:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, warning, critical]
          description: Overall system health status
        queue:
          type: object
          properties:
            totalQueued:
              type: integer
            processing:
              type: integer
            failed:
              type: integer
          description: Queue status information
        performance:
          type: object
          properties:
            totalNotifications:
              type: integer
            successfulNotifications:
              type: integer
            failedNotifications:
              type: integer
            successRate:
              type: string
            avgProcessingTime:
              type: number
          description: Performance metrics
        channels:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
              total:
                type: integer
              successful:
                type: integer
              failed:
                type: integer
              successRate:
                type: string
          description: Channel-specific health metrics
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp

    PaginationInfo:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        limit:
          type: integer
          description: Items per page
        offset:
          type: integer
          description: Current offset
        hasMore:
          type: boolean
          description: Whether more items are available

    SearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
        total:
          type: integer
        suggestions:
          type: array
          items:
            type: string
        filters:
          type: object
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total_pages:
              type: integer
            has_next:
              type: boolean
            has_prev:
              type: boolean

    ExportRequest:
      type: object
      properties:
        id:
          type: string
        format:
          type: string
          enum: [csv, excel, pdf, json]
        data_type:
          type: string
          enum: [visitors, users, audit_logs, reports]
        filters:
          type: object
        fields:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        download_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    PerformanceMetrics:
      type: object
      properties:
        response_times:
          type: object
          properties:
            p50:
              type: number
            p95:
              type: number
            p99:
              type: number
        error_rates:
          type: object
          properties:
            total:
              type: number
            by_endpoint:
              type: object
        throughput:
          type: object
          properties:
            requests_per_minute:
              type: number
            concurrent_users:
              type: number
        system_health:
          type: object
          properties:
            database:
              type: string
              enum: [healthy, degraded, unhealthy]
            cache:
              type: string
              enum: [healthy, degraded, unhealthy]
            external_services:
              type: object
          format: date-time
        check_out_time:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BulkInvite:
      type: object
      properties:
        id:
          type: integer
        invite_code:
          type: string
        event_name:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        num_guests:
          type: integer
        created_by:
          type: string
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED]

    Pass:
      type: object
      properties:
        id:
          type: integer
        visitor_id:
          type: integer
        qr_code:
          type: string
        access_code:
          type: string
        expires_at:
          type: string
          format: date-time
        is_active:
          type: boolean

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        code:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string
        code:
          type: integer

paths:
  # Authentication Endpoints
  /users/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user with role-based permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum: [resident, guard, admin]
                area:
                  type: string
                phone:
                  type: string
                house:
                  type: string
              required: [username, email, password, role]
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                remember:
                  type: boolean
              required: [email, password]
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                  role:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Invalidate user session and JWT token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /users/profile:
    put:
      tags:
        - User Management
      summary: Update user profile
      description: Update authenticated user's profile information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                phone:
                  type: string
                area:
                  type: string
                house:
                  type: string
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # Visitor Management Endpoints
  /visitors:
    post:
      tags:
        - Visitor Management
      summary: Create visitor invitation
      description: Create a new visitor invitation (Resident only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                id_number:
                  type: string
                vehicle_plate:
                  type: string
                date_of_visit:
                  type: string
                  format: date
                time:
                  type: string
                purpose:
                  type: string
              required: [name, phone, date_of_visit, time, purpose]
      responses:
        '201':
          description: Visitor invitation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Visitor'

    get:
      tags:
        - Visitor Management
      summary: Get my visitors
      description: Get all visitors created by the authenticated resident
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, CONFIRMED, ON_PREMISE, EXITED, REVOKED, EXPIRED]
      responses:
        '200':
          description: Visitors retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Visitor'

  /visitors/{visitorId}/pass:
    post:
      tags:
        - Pass Generation
      summary: Generate visitor pass
      description: Generate QR code pass for confirmed visitor
      security:
        - bearerAuth: []
      parameters:
        - name: visitorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Pass generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Pass'

  /visitors/bulk-invite:
    post:
      tags:
        - Bulk Operations
      summary: Create bulk invitation
      description: Create bulk invitation for multiple guests
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_name:
                  type: string
                date:
                  type: string
                  format: date
                time:
                  type: string
                num_guests:
                  type: integer
                  minimum: 1
                  maximum: 50
              required: [event_name, date, time, num_guests]
      responses:
        '201':
          description: Bulk invitation created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BulkInvite'

  /visitors/bulk-invite/{inviteCode}:
    get:
      tags:
        - Bulk Operations
      summary: Get bulk invitation details
      description: Get details of bulk invitation by code (Public endpoint)
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bulk invitation details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BulkInvite'

  /visitors/complete/{inviteCode}:
    post:
      tags:
        - Bulk Operations
      summary: Complete guest registration
      description: Complete registration for bulk invitation guest (Public endpoint)
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                id_number:
                  type: string
                vehicle_plate:
                  type: string
                expected_time:
                  type: string
              required: [name, phone, email]
      responses:
        '201':
          description: Guest registration completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  visitor:
                    $ref: '#/components/schemas/Visitor'
                  otp_issued:
                    type: boolean
                  otp_ttl_minutes:
                    type: integer

  # Guard Operations
  /visitors/{id}/check-in:
    post:
      tags:
        - Guard Operations
      summary: Check in visitor
      description: Check in visitor at the gate (Guard/Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Visitor checked in successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                        example: ON_PREMISE
                      check_in_time:
                        type: string
                        format: date-time
                      already_checked_in:
                        type: boolean

  /visitors/{id}/check-out:
    post:
      tags:
        - Guard Operations
      summary: Check out visitor
      description: Check out visitor from the premises (Guard/Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Visitor checked out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                        example: EXITED
                      check_out_time:
                        type: string
                        format: date-time
                      already_checked_out:
                        type: boolean

  /visitors/{id}/revoke:
    post:
      tags:
        - Guard Operations
      summary: Revoke visitor access
      description: Revoke visitor access and invalidate passes (Guard/Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Visitor access revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      status:
                        type: string
                        example: REVOKED

  /visitors/active:
    get:
      tags:
        - Guard Operations
      summary: Get active visitors
      description: Get list of visitors currently on premises (Guard/Admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active visitors retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
