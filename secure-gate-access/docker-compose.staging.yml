version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: securegate-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-staging_password_change_me}
      POSTGRES_DB: ${PGDATABASE:-secure_gate_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: securegate-staging-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 5001
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-staging_password_change_me}
      PGDATABASE: ${PGDATABASE:-secure_gate_staging}
      JWT_SECRET: ${JWT_SECRET:-staging-jwt-secret-min-32-chars-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-staging-refresh-secret-change-in-prod}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_CORRELATION_ID: ${ENABLE_CORRELATION_ID:-true}
      ENABLE_ENHANCED_HEALTH: ${ENABLE_ENHANCED_HEALTH:-true}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      ENABLE_ERROR_MONITORING: ${ENABLE_ERROR_MONITORING:-true}
      AUTO_RUN_MIGRATIONS: ${AUTO_RUN_MIGRATIONS:-true}
      CLIENT_ORIGIN: http://localhost:3001
      STAGING_CLIENT_ORIGIN: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "5001:5001"
    volumes:
      - ./server/logs:/app/logs
      - staging_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', (r) => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - staging-network

  # Frontend (optional, for full-stack staging)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: securegate-staging-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5001
      NODE_ENV: production
    ports:
      - "3001:80"
    networks:
      - staging-network

volumes:
  postgres_staging_data:
    driver: local
  staging_logs:
    driver: local

networks:
  staging-network:
    driver: bridge
