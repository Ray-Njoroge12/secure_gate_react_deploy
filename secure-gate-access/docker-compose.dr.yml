# Disaster Recovery Configuration for Secure Gate Access Control System
# Secondary region deployment with cross-region replication

version: '3.8'

services:
  # PostgreSQL DR Primary
  postgres-dr-primary:
    image: postgres:15-alpine
    container_name: secure-gate-postgres-dr-primary
    environment:
      - POSTGRES_DB=secure_gate_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SecureGate2024!DBPassword
      - PATRONI_SCOPE=postgres-dr
      - PATRONI_NAMESPACE=/patroni-dr/
      - PATRONI_LOG_LEVEL=INFO
      - PATRONI_ETCD_HOSTS=etcd-dr1:2379,etcd-dr2:2379,etcd-dr3:2379
      - PATRONI_POSTGRESQL_DATA_DIR=/var/lib/postgresql/data/pgdata
      - PATRONI_POSTGRESQL_PGPASS=/tmp/pgpass
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres-dr-primary:5432
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres-dr-primary:8008
      - PATRONI_SUPERUSER_USERNAME=postgres
      - PATRONI_SUPERUSER_PASSWORD=SecureGate2024!DBPassword
      - PATRONI_REPLICATION_USERNAME=replicator
      - PATRONI_REPLICATION_PASSWORD=SecureGate2024!ReplicationPassword
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - postgres_dr_primary_data:/var/lib/postgresql/data
      - ./patroni/dr/postgres-dr-primary.yml:/etc/patroni.yml:ro
    command: ["patroni", "/etc/patroni.yml"]
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL DR Replica
  postgres-dr-replica:
    image: postgres:15-alpine
    container_name: secure-gate-postgres-dr-replica
    environment:
      - POSTGRES_DB=secure_gate_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SecureGate2024!DBPassword
      - PATRONI_SCOPE=postgres-dr
      - PATRONI_NAMESPACE=/patroni-dr/
      - PATRONI_LOG_LEVEL=INFO
      - PATRONI_ETCD_HOSTS=etcd-dr1:2379,etcd-dr2:2379,etcd-dr3:2379
      - PATRONI_POSTGRESQL_DATA_DIR=/var/lib/postgresql/data/pgdata
      - PATRONI_POSTGRESQL_PGPASS=/tmp/pgpass
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=postgres-dr-replica:5432
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_CONNECT_ADDRESS=postgres-dr-replica:8008
      - PATRONI_SUPERUSER_USERNAME=postgres
      - PATRONI_SUPERUSER_PASSWORD=SecureGate2024!DBPassword
      - PATRONI_REPLICATION_USERNAME=replicator
      - PATRONI_REPLICATION_PASSWORD=SecureGate2024!ReplicationPassword
    ports:
      - "5433:5432"
      - "8009:8008"
    volumes:
      - postgres_dr_replica_data:/var/lib/postgresql/data
      - ./patroni/dr/postgres-dr-replica.yml:/etc/patroni.yml:ro
    command: ["patroni", "/etc/patroni.yml"]
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis DR Master
  redis-dr-master:
    image: redis:7-alpine
    container_name: secure-gate-redis-dr-master
    command: redis-server --appendonly yes --appendfsync everysec --requirepass SecureGate2024!RedisPassword
    ports:
      - "6379:6379"
    volumes:
      - redis_dr_master_data:/data
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis DR Replica
  redis-dr-replica:
    image: redis:7-alpine
    container_name: secure-gate-redis-dr-replica
    command: redis-server --appendonly yes --appendfsync everysec --requirepass SecureGate2024!RedisPassword --replicaof redis-dr-master 6379 --masterauth SecureGate2024!RedisPassword
    ports:
      - "6380:6379"
    volumes:
      - redis_dr_replica_data:/data
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    depends_on:
      - redis-dr-master

  # Vault DR Node 1
  vault-dr-1:
    image: vault:1.15.2
    container_name: secure-gate-vault-dr-1
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DR_ROOT_TOKEN:-SG2024!VaultDRRootTokenForSecureGate}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_CLUSTER_ADDR: http://vault-dr-1:8201
      VAULT_UI: true
      VAULT_LOG_LEVEL: info
    ports:
      - "8200:8200"
      - "8201:8201"
    volumes:
      - vault_dr1_data:/vault/data
      - vault_dr1_config:/vault/config
      - ./vault/dr/vault-dr-1.hcl:/vault/config/vault.hcl:ro
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    restart: unless-stopped
    networks:
      - dr-network
      - secure-gate-network

  # Vault DR Node 2
  vault-dr-2:
    image: vault:1.15.2
    container_name: secure-gate-vault-dr-2
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DR_ROOT_TOKEN:-SG2024!VaultDRRootTokenForSecureGate}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_CLUSTER_ADDR: http://vault-dr-2:8201
      VAULT_UI: true
      VAULT_LOG_LEVEL: info
    ports:
      - "8202:8200"
      - "8203:8201"
    volumes:
      - vault_dr2_data:/vault/data
      - vault_dr2_config:/vault/config
      - ./vault/dr/vault-dr-2.hcl:/vault/config/vault.hcl:ro
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    restart: unless-stopped
    networks:
      - dr-network
      - secure-gate-network

  # Application DR Instance
  server-dr:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: secure-gate-server-dr
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres-dr-primary
      DB_PORT: 5432
      DB_NAME: secure_gate_db
      DB_USER: postgres
      DB_PASSWORD: SecureGate2024!DBPassword
      REDIS_HOST: redis-dr-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: SecureGate2024!RedisPassword
      VAULT_ADDR: http://vault-dr-1:8200
      VAULT_TOKEN: ${VAULT_DR_ROOT_TOKEN:-SG2024!VaultDRRootTokenForSecureGate}
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    depends_on:
      - postgres-dr-primary
      - redis-dr-master
      - vault-dr-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Client DR Instance
  client-dr:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: secure-gate-client-dr
    ports:
      - "80:80"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    depends_on:
      - server-dr

  # HAProxy DR Load Balancer
  haproxy-dr:
    image: haproxy:2.8-alpine
    container_name: secure-gate-haproxy-dr
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # HAProxy stats
    volumes:
      - ./haproxy/dr/haproxy-dr.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    depends_on:
      - postgres-dr-primary
      - postgres-dr-replica
      - redis-dr-master
      - redis-dr-replica
      - vault-dr-1
      - vault-dr-2
      - server-dr
      - client-dr

  # Cross-Region Replication Service
  replication-service:
    build:
      context: ./replication
      dockerfile: Dockerfile
    container_name: secure-gate-replication-service
    environment:
      PRIMARY_DB_HOST: postgres-primary
      PRIMARY_DB_PORT: 5432
      DR_DB_HOST: postgres-dr-primary
      DR_DB_PORT: 5432
      PRIMARY_REDIS_HOST: redis-master
      PRIMARY_REDIS_PORT: 6379
      DR_REDIS_HOST: redis-dr-master
      DR_REDIS_PORT: 6379
      PRIMARY_VAULT_ADDR: http://vault-1:8200
      DR_VAULT_ADDR: http://vault-dr-1:8200
      REPLICATION_INTERVAL: 30000
    volumes:
      - ./replication:/app
      - /app/node_modules
    networks:
      - dr-network
      - secure-gate-network
    restart: unless-stopped
    depends_on:
      - postgres-dr-primary
      - redis-dr-master
      - vault-dr-1

# Named volumes for data persistence
volumes:
  postgres_dr_primary_data:
    driver: local
  postgres_dr_replica_data:
    driver: local
  redis_dr_master_data:
    driver: local
  redis_dr_replica_data:
    driver: local
  vault_dr1_data:
    driver: local
  vault_dr1_config:
    driver: local
  vault_dr2_data:
    driver: local
  vault_dr2_config:
    driver: local

# Networks
networks:
  dr-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16
  secure-gate-network:
    external: true
