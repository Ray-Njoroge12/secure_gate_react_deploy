server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}
    basic_auth:
      username: ${LOKI_USERNAME}
      password: ${LOKI_PASSWORD}

scrape_configs:
  - job_name: securegate-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: securegate-api
          __path__: /var/log/securegate/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            request_id: request_id
            user_id: user_id
            estate_id: estate_id
            route: route
            status: status
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.000"
  - job_name: securegate-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: securegate-audit
          __path__: /var/log/securegate/audit/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            request_id: request_id
            user_id: user_id
            estate_id: estate_id
            route: route
            status: status
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05.000"
