# /etc/nginx/sites-available/securegate

server {
    listen 80;
    server_name api.securegate.co.ke; # Replace with your actual domain

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.securegate.co.ke; # Replace with your actual domain

    # SSL Certificates - To be generated by Certbot
    # ssl_certificate /etc/letsencrypt/live/api.securegate.co.ke/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.securegate.co.ke/privkey.pem;
    
    # Placeholder self-signed certs (remove after Certbot)
    ssl_certificate /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Backend API Proxy
    location / {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Rate Limiting Headers
        add_header X-RateLimit-Limit $upstream_http_x_ratelimit_limit;
        add_header X-RateLimit-Remaining $upstream_http_x_ratelimit_remaining;
    }

    # Health Check
    location /health {
        proxy_pass http://localhost:5001/api/health;
        access_log off;
    }
}
