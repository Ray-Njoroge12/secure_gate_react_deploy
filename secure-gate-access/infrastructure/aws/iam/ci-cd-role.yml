AWSTemplateFormatVersion: '2010-09-09'
Description: CI/CD IAM role with least-privilege deployment permissions for Secure Gate.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the GitHub OIDC provider (arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com)
  GitHubRepository:
    Type: String
    Description: GitHub repo in org/name format (e.g., secure-gate/secure-gate-access)
  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch allowed to assume the role
  EcsClusterArn:
    Type: String
  EcsServiceArn:
    Type: String
  EcsTaskExecutionRoleArn:
    Type: String
  EcsTaskRoleArn:
    Type: String
  EcrRepositoryArn:
    Type: String
  WebAppBucketArn:
    Type: String
  CloudFrontDistributionArn:
    Type: String

Resources:
  CiCdRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: secure-gate-cicd-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: secure-gate-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowEcsDeployments
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                Resource:
                  - !Ref EcsClusterArn
                  - !Ref EcsServiceArn
              - Sid: AllowPassRolesForEcs
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Ref EcsTaskExecutionRoleArn
                  - !Ref EcsTaskRoleArn
              - Sid: AllowEcrPushPull
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:DescribeRepositories
                Resource:
                  - !Ref EcrRepositoryArn
              - Sid: AllowStaticAssetUploads
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub ${WebAppBucketArn}/*
              - Sid: AllowCloudFrontInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource:
                  - !Ref CloudFrontDistributionArn

Outputs:
  CiCdRoleArn:
    Value: !GetAtt CiCdRole.Arn
