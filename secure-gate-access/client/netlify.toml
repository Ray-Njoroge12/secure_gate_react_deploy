[build]
  base = "secure-gate-access/client"
  publish = "build"
  command = "npm run build:production"

[[redirects]]
  from = "/api/*"
  to = "https://secure-gate-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  CI = "false"
  REACT_APP_API_URL = "https://secure-gate-api.onrender.com"
  REACT_APP_WS_URL = "wss://secure-gate-api.onrender.com"
