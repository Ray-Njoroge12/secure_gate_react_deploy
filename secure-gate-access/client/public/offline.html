<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="SecureGate - Offline Mode" />
    <title>SecureGate - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .offline-container {
            max-width: 500px;
            width: 100%;
        }
        .offline-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .offline-button {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <h1 class="offline-title">You're Offline</h1>
        <p>SecureGate works offline too. Some features are still available.</p>
        <button class="offline-button" onclick="window.location.href='/'">
            Go to App
        </button>
    </div>
</body>
</html>
