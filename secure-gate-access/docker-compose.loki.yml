version: '3.8'

services:
  loki:
    image: grafana/loki:2.9.8
    container_name: securegate-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yml

  promtail:
    image: grafana/promtail:2.9.8
    container_name: securegate-promtail
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./observability/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - staging_logs:/var/log/securegate:ro
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

volumes:
  loki_data:
  staging_logs:
    external: true
    name: secure-gate-access_staging_logs
