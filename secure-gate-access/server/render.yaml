services:
  # Backend API
  - type: web
    name: secure-gate-server
    runtime: node
    plan: free
    region: oregon 
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: secure-gate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: secure-gate-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: SERVER_URL
        value: https://secure-gate-server.onrender.com
      - key: CLIENT_ORIGIN
        value: https://secure-gate-client.netlify.app

databases:
  # Managed PostgreSQL
  - name: secure-gate-db
    databaseName: secure_gate_db
    user: secure_gate_user
    plan: free # or starter/standard for production

  # Managed Redis
  - name: secure-gate-cache
    plan: free # or starter for production
