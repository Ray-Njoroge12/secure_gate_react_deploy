# HAProxy Configuration for Secure Gate Access Control System
# Load balancing for PostgreSQL, Redis, Vault, and application services

global
    daemon
    log stdout local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private
    ssl-default-bind-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 20s
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

# HAProxy Statistics
listen stats
    bind *:8080
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# PostgreSQL Load Balancing
listen postgres-write
    bind *:5432
    mode tcp
    option tcp-check
    tcp-check connect port 5432
    balance roundrobin
    server postgres-primary postgres-primary:5432 check
    server postgres-replica1 postgres-replica1:5432 check backup
    server postgres-replica2 postgres-replica2:5432 check backup

listen postgres-read
    bind *:5433
    mode tcp
    option tcp-check
    tcp-check connect port 5432
    balance roundrobin
    server postgres-replica1 postgres-replica1:5432 check
    server postgres-replica2 postgres-replica2:5432 check
    server postgres-primary postgres-primary:5432 check backup

# Redis Load Balancing
listen redis
    bind *:6379
    mode tcp
    option tcp-check
    tcp-check connect port 6379
    balance roundrobin
    server redis-master redis-master:6379 check
    server redis-replica1 redis-replica1:6379 check backup
    server redis-replica2 redis-replica2:6379 check backup

# Redis Sentinel Load Balancing
listen redis-sentinel
    bind *:26379
    mode tcp
    option tcp-check
    tcp-check connect port 26379
    balance roundrobin
    server redis-sentinel1 redis-sentinel1:26379 check
    server redis-sentinel2 redis-sentinel2:26379 check
    server redis-sentinel3 redis-sentinel3:26379 check

# Vault Load Balancing
listen vault
    bind *:8200
    mode http
    option httpchk GET /v1/sys/health
    balance roundrobin
    server vault-1 vault-1:8200 check
    server vault-2 vault-2:8200 check
    server vault-3 vault-3:8200 check

# Application Load Balancing
listen app-http
    bind *:80
    mode http
    option httpchk GET /health
    balance roundrobin
    server app-1 server:3000 check
    server app-2 server:3001 check backup

listen app-https
    bind *:443 ssl crt /etc/ssl/certs/securegate.pem
    mode http
    option httpchk GET /health
    balance roundrobin
    server app-1 server:3000 check
    server app-2 server:3001 check backup
    redirect scheme https if !{ ssl_fc }
