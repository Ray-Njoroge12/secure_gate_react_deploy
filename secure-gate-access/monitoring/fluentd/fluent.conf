<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type tail
  path /var/log/secure-gate-access/*.log
  pos_file /var/log/fluentd/secure-gate-access.log.pos
  tag secure-gate-access
  format json
  time_key timestamp
  time_format %Y-%m-%dT%H:%M:%S.%L%z
</source>

<source>
  @type tail
  path /var/log/syslog
  pos_file /var/log/fluentd/syslog.log.pos
  tag system
  format syslog
</source>

<filter secure-gate-access>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

<filter system>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type syslog
  </parse>
</filter>

<match secure-gate-access.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name secure-gate-access
  type_name _doc
  <buffer>
    @type file
    path /var/log/fluentd/buffers/secure-gate-access
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
    overflow_action block
  </buffer>
</match>

<match system.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  index_name system-logs
  type_name _doc
  <buffer>
    @type file
    path /var/log/fluentd/buffers/system
    flush_mode interval
    retry_type exponential_backoff
    flush_thread_count 2
    flush_interval 5s
    retry_forever
    retry_max_interval 30
    chunk_limit_size 2M
    queue_limit_length 8
    overflow_action block
  </buffer>
</match>

<match **>
  @type stdout
</match>
