# Alertmanager Configuration for Secure Gate Access Control System
# This configuration defines how alerts are routed and handled

global:
  # SMTP configuration for email alerts
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@securegate.com'
  smtp_auth_username: 'alerts@securegate.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true
  
  # Resolve timeout for alerts
  resolve_timeout: 5m
  
  # Default group wait time
  group_wait: 10s
  
  # Default group interval
  group_interval: 10s
  
  # Default repeat interval
  repeat_interval: 1h

# Route configuration - defines how alerts are routed
route:
  # Default receiver
  receiver: 'default'
  
  # Group alerts by cluster and alertname
  group_by: ['cluster', 'alertname']
  
  # Group wait time
  group_wait: 10s
  
  # Group interval
  group_interval: 10s
  
  # Repeat interval
  repeat_interval: 12h
  
  # Group interval for critical alerts
  group_interval: 5s
  
  # Routes for specific alert types
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 5s
      repeat_interval: 5m
      continue: true
    
    # High severity alerts
    - match:
        severity: high
      receiver: 'high-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m
      continue: true
    
    # Database alerts
    - match:
        service: database
      receiver: 'database-alerts'
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 2h
      continue: true
    
    # Application alerts
    - match:
        service: application
      receiver: 'application-alerts'
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 1h
      continue: true
    
    # Security alerts
    - match:
        service: security
      receiver: 'security-alerts'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 15m
      continue: true
    
    # Infrastructure alerts
    - match:
        service: infrastructure
      receiver: 'infrastructure-alerts'
      group_wait: 5m
      group_interval: 15m
      repeat_interval: 4h
      continue: true

# Inhibition rules - suppress alerts based on other alerts
inhibit_rules:
  # Suppress all alerts if the cluster is down
  - source_match:
      alertname: 'ClusterDown'
    target_match:
      severity: 'warning'
    equal: ['cluster']
  
  # Suppress database alerts if database is unreachable
  - source_match:
      alertname: 'DatabaseUnreachable'
    target_match:
      service: 'database'
    equal: ['cluster']
  
  # Suppress application alerts if application is down
  - source_match:
      alertname: 'ApplicationDown'
    target_match:
      service: 'application'
    equal: ['cluster']

# Receiver definitions
receivers:
  # Default receiver - log only
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@securegate.com'
        subject: '🚨 CRITICAL ALERT: {{ .GroupLabels.alertname }}'
        html: |
          <h2>Critical Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Cluster:</strong> {{ .GroupLabels.cluster }}</p>
          <p><strong>Time:</strong> {{ .Status.TriggeredAt }}</p>
          <h3>Alert Details:</h3>
          <ul>
          {{ range .Alerts }}
            <li>
              <strong>{{ .Labels.alertname }}:</strong> {{ .Annotations.description }}<br>
              <strong>Instance:</strong> {{ .Labels.instance }}<br>
              <strong>Severity:</strong> {{ .Labels.severity }}
            </li>
          {{ end }}
          </ul>
        send_resolved: true
    
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-critical'
        title: '🚨 Critical Alert'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Cluster:* {{ .GroupLabels.cluster }}
          *Time:* {{ .Status.TriggeredAt }}
          
          {{ range .Alerts }}
          *{{ .Labels.alertname }}:* {{ .Annotations.description }}
          *Instance:* {{ .Labels.instance }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        send_resolved: true
    
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        description: 'Critical alert: {{ .GroupLabels.alertname }}'
        severity: 'critical'
        details:
          cluster: '{{ .GroupLabels.cluster }}'
          alertname: '{{ .GroupLabels.alertname }}'
        send_resolved: true

  # High severity alerts
  - name: 'high-alerts'
