# Alertmanager Configuration for Secure Gate Access Control System
# Comprehensive alert routing and notification setup

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@securegate.local'
  smtp_auth_username: 'alerts@securegate.local'
  smtp_auth_password: 'SecureGate2024!SMTPPassword'
  smtp_require_tls: true

# Alert routing rules
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 30m
      
    # Warning alerts - grouped notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h
      
    # Backup-specific alerts
    - match:
        alertname: BackupJobFailed
      receiver: 'backup-alerts'
      group_wait: 5s
      repeat_interval: 15m
      
    # Restore-specific alerts
    - match:
        alertname: RestoreTestFailed
      receiver: 'backup-alerts'
      group_wait: 5s
      repeat_interval: 15m
      
    # Storage alerts
    - match:
        alertname: StorageUsageHigh
      receiver: 'storage-alerts'
      group_wait: 10s
      repeat_interval: 1h
      
    # Service down alerts
    - match:
        alertname: ServiceDown
      receiver: 'service-alerts'
      group_wait: 5s
      repeat_interval: 10m

# Receivers configuration
receivers:
  # Webhook receiver for general alerts
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://server:3000/api/alerts/webhook'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'webhook'
            password: 'SecureGate2024!WebhookPassword'

  # Critical alerts receiver
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@securegate.local'
        subject: '[CRITICAL] Secure Gate Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}
        headers:
          X-Priority: '1'
    webhook_configs:
      - url: 'http://server:3000/api/alerts/critical'
        send_resolved: true

  # Warning alerts receiver
  - name: 'warning-alerts'
    email_configs:
      - to: 'ops@securegate.local'
        subject: '[WARNING] Secure Gate Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://server:3000/api/alerts/warning'
        send_resolved: true

  # Backup alerts receiver
  - name: 'backup-alerts'
    email_configs:
      - to: 'backup-team@securegate.local'
        subject: '[BACKUP] Secure Gate Backup Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Backup ID: {{ .Labels.backup_id }}
          Test ID: {{ .Labels.test_id }}
          Severity: {{ .Labels.severity }}
          Time: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://server:3000/api/alerts/backup'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#backup-alerts'
        title: 'Secure Gate Backup Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Time:* {{ .StartsAt }}
          {{ end }}

  # Storage alerts receiver
  - name: 'storage-alerts'
    email_configs:
      - to: 'storage-team@securegate.local'
        subject: '[STORAGE] Secure Gate Storage Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Usage: {{ .Labels.usage_percentage }}%
          Available: {{ .Labels.available_space }}GB
          Severity: {{ .Labels.severity }}
          Time: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://server:3000/api/alerts/storage'
        send_resolved: true

  # Service alerts receiver
  - name: 'service-alerts'
    email_configs:
      - to: 'ops@securegate.local'
        subject: '[SERVICE] Secure Gate Service Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          Time: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://server:3000/api/alerts/service'
        send_resolved: true
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        description: 'Secure Gate Service Alert: {{ .GroupLabels.alertname }}'
        details:
          service: '{{ .Labels.service }}'
          instance: '{{ .Labels.instance }}'
          severity: '{{ .Labels.severity }}'

# Inhibition rules to prevent alert spam
inhibit_rules:
  # Inhibit warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
    
  # Inhibit individual service alerts when cluster is down
  - source_match:
      alertname: 'ClusterDown'
    target_match_re:
      alertname: '.*ServiceDown'
    equal: ['cluster']
    
  # Inhibit backup alerts when storage is full
  - source_match:
      alertname: 'StorageFull'
    target_match:
      alertname: 'BackupJobFailed'
    equal: ['cluster']

# Template for alert formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'
