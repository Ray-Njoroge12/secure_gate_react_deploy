input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
  
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [fields][service] == "secure-gate-access" {
    mutate {
      add_field => { "service_name" => "secure-gate-access" }
    }
    
    if [trace_id] {
      mutate {
        add_field => { "trace_id" => "%{[trace_id]}" }
      }
    }
    
    if [actor] {
      mutate {
        add_field => { "actor" => "%{[actor]}" }
      }
    }
    
    if [action] {
      mutate {
        add_field => { "action" => "%{[action]}" }
      }
    }
    
    if [status] {
      mutate {
        add_field => { "status" => "%{[status]}" }
      }
    }
    
    if [rollback_status] {
      mutate {
        add_field => { "rollback_status" => "%{[rollback_status]}" }
      }
    }
    
    if [level] {
      mutate {
        add_field => { "log_level" => "%{[level]}" }
      }
    }
    
    if [metadata] {
      ruby {
        code => "event.set('metadata', JSON.parse(event.get('metadata'))) if event.get('metadata').is_a?(String)"
      }
    }
  }
  
  if [fields][service] == "system" {
    mutate {
      add_field => { "service_name" => "system" }
    }
    
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:timestamp} %{IPORHOST:hostname} %{PROG:program}: %{GREEDYDATA:message}" }
    }
    
    date {
      match => [ "timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }
  
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "environment" => "%{[fields][environment]}" }
    add_field => { "datacenter" => "%{[fields][datacenter]}" }
  }
}

output {
  if [service_name] == "secure-gate-access" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "secure-gate-access-%{+YYYY.MM.dd}"
      document_type => "_doc"
      template_name => "secure-gate-access"
      template => "/usr/share/logstash/templates/secure-gate-access.json"
      template_overwrite => true
    }
  }
  
  if [service_name] == "system" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "system-logs-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Fallback output
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Debug output
  stdout {
    codec => rubydebug
  }
}
