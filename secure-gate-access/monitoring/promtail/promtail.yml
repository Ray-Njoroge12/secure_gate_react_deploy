server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  - job_name: secure-gate-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: secure-gate-access
          __path__: /var/log/secure-gate-access/*.log

    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            trace_id: trace_id
            actor: actor
            action: action
            status: status
            rollback_status: rollback_status
            level: level
            message: message
            metadata: metadata
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          trace_id:
          actor:
          action:
          status:
          rollback_status:
          level:
      - output:
          source: message

  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog

    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\S+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+):\s+(?P<message>.*)'
      - timestamp:
          source: timestamp
          format: Jan 2 15:04:05
      - labels:
          hostname:
          service:
      - output:
          source: message
