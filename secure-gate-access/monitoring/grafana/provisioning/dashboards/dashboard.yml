# Grafana Dashboard Provisioning Configuration
# Automatic dashboard loading for Secure Gate monitoring

apiVersion: 1

providers:
  - name: 'secure-gate-dashboards'
    orgId: 1
    folder: 'Secure Gate'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
