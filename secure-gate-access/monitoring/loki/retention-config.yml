# Loki Log Retention Configuration
# This configuration defines log retention policies for different log types

auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Log retention policies
limits_config:
  # Global retention period (fallback)
  retention_period: 744h  # 31 days
  
  # Per-stream retention policies
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  
  # Ingestion limits
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  
  # Query limits
  max_query_series: 1000
  max_query_parallelism: 32
  max_entries_limit_per_query: 10000
  max_query_length: 721h
  max_query_lookback: 721h
  
  # Retention rules for different log types
  retention_streams:
    # Debug logs - 7 days
    - selector: '{level="debug"}'
      priority: 1
      period: 168h  # 7 days
    
    # Info logs - 30 days
    - selector: '{level="info"}'
      priority: 2
      period: 720h  # 30 days
    
    # Warning logs - 60 days
    - selector: '{level="warn"}'
      priority: 3
      period: 1440h  # 60 days
    
    # Error logs - 90 days
    - selector: '{level="error"}'
      priority: 4
      period: 2160h  # 90 days
    
    # Application logs - 30 days
    - selector: '{job="secure-gate-backend"}'
      priority: 5
      period: 720h  # 30 days
    
    # Database logs - 60 days
    - selector: '{job="postgres"}'
      priority: 6
      period: 1440h  # 60 days
    
    # Security logs - 365 days (compliance)
    - selector: '{service="security"}'
      priority: 7
      period: 8760h  # 365 days
    
    # Audit logs - 365 days (compliance)
    - selector: '{service="audit"}'
      priority: 8
      period: 8760h  # 365 days
    
    # Access logs - 90 days
    - selector: '{job="nginx"}'
      priority: 9
      period: 2160h  # 90 days
    
    # Monitoring logs - 30 days
    - selector: '{job=~"prometheus|grafana|alertmanager"}'
      priority: 10
      period: 720h  # 30 days

# Compaction configuration
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  
  # Compaction retention policies
  compactor_ring:
    kvstore:
      store: inmemory

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 744h  # 31 days

# Storage configuration
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  
  filesystem:
    directory: /loki/chunks

# Log level
log_level: info

# Log format
log_format: json

# External labels for identifying this Loki instance
external_labels:
  cluster: secure-gate
  environment: production
