# Prometheus Configuration for Secure Gate Access Control System
# Comprehensive monitoring setup with backup and restore metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'secure-gate'
    environment: 'production'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: /metrics

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: /metrics

  # Redis Exporter - Redis metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metrics_path: /metrics

  # PostgreSQL Exporter - Database metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: /metrics

  # Backup Metrics Exporter - Custom backup metrics
  - job_name: 'backup-metrics-exporter'
    static_configs:
      - targets: ['backup-metrics-exporter:9091']
    scrape_interval: 30s
    metrics_path: /metrics

  # Secure Gate Backend - Application metrics
  - job_name: 'secure-gate-backend'
    static_configs:
      - targets: ['server:3000']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

  # Secure Gate Frontend - Frontend metrics
  - job_name: 'secure-gate-frontend'
    static_configs:
      - targets: ['client:80']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http

  # Vault - Vault metrics
  - job_name: 'vault'
    static_configs:
      - targets: ['vault:8200']
    scrape_interval: 30s
    metrics_path: /v1/sys/metrics
    scheme: http
    params:
      format: ['prometheus']

  # Consul - Consul metrics
  - job_name: 'consul'
    static_configs:
      - targets: ['consul:8500']
    scrape_interval: 30s
    metrics_path: /v1/agent/metrics
    scheme: http
    params:
      format: ['prometheus']
