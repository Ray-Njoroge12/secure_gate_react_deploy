# Docker Compose for Secure Gate Production Deployment
# Complete production stack with all services

version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: secure_gate
      POSTGRES_USER: secure_gate_user
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_gate_user -d secure_gate"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - secure-gate-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "auth", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - secure-gate-network

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 5000
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: secure_gate
      PGUSER: secure_gate_user
      PGPASSWORD: ${PGPASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}  # Set to true when SSL is configured
      ALLOW_HTTP_IN_PRODUCTION: true  # Allow HTTP for local development
      SECURE_COOKIES: ${SECURE_COOKIES:-true}  # Enable secure cookies in production
      CORS_ORIGIN: http://localhost
      API_BASE_URL: http://localhost:5001
      LOG_LEVEL: warn
      ENABLE_MONITORING: true
      
      # Email Configuration (Gmail)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-rayngi12@gmail.com}
      SMTP_PASS: ${SMTP_PASS}
      FROM_EMAIL: ${FROM_EMAIL:-rayngi12@gmail.com}
      SITE_NAME: ${SITE_NAME:-Secure Gate Access}
      SITE_URL: ${SITE_URL:-http://localhost}
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-true}
    ports:
      - "5001:5000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - secure-gate-network

  # Frontend Web Application
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - secure-gate-network

# Nginx Reverse Proxy removed for simplified deployment
# Add SSL termination at load balancer level in production

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Network for service communication
networks:
  secure-gate-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

