services:
  - type: web
    name: securegate-api
    env: node
    region: frankfurt  # Closest to Africa
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SITE_NAME
        value: Secure Gate Access
      - key: ENFORCE_HTTPS
        value: true
      - key: SECURE_COOKIES
        value: true
      - key: TRUST_PROXY
        value: true
      - key: SMS_PROVIDER
        value: africastalking
      - key: EMAIL_PROVIDER
        value: mailgun
      - key: AT_USERNAME
        value: securelabstest
      - key: MAILGUN_DOMAIN
        value: sandboxcd6106b9f4d54da78846462008c1678b.mailgun.org
      - key: MAILGUN_BASE_URL
        value: https://api.mailgun.net
      - key: ENABLE_EXTERNAL_NOTIFICATIONS
        value: true
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: true
      - key: ENABLE_SMS_NOTIFICATIONS
        value: true
      - key: EMAIL_VERIFICATION_REQUIRED
        value: false
      # Secrets - set these in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: MAILGUN_API_KEY
        sync: false

databases:
  - name: securegate-db
    plan: free
    databaseName: secure_gate
    user: securegate_user
