# Docker Compose Override for Development
# This file provides development-specific overrides for docker-compose.prod.yml

version: '3.8'

services:
  # Backend development overrides
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      REDIS_PASSWORD: ""
      # Email Configuration (Mailgun)
      MAILGUN_API_KEY: "9e1d5b8936fc15ec09e88b08908e2a37-5e1ffd43-becdfdc6"
      MAILGUN_DOMAIN: "sandboxcd6106b9f4d54da78846462008c1678b.mailgun.org"
      MAILGUN_BASE_URL: "https://api.mailgun.net"
      EMAIL_FROM: "noreply@sandboxcd6106b9f4d54da78846462008c1678b.mailgun.org"
      EMAIL_FROM_NAME: "Secure Gate Access"
      FRONTEND_URL: "http://localhost:3001"
    ports:
      - "5001:5000"
    command: npm run dev

  # Frontend development overrides
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    environment:
      REACT_APP_ENVIRONMENT: development
      REACT_APP_API_URL: http://localhost:5001
    ports:
      - "3001:80"

  # Database development overrides
  postgres:
    environment:
      POSTGRES_DB: secure_gate_dev
    ports:
      - "5432:5432"

  # Redis development overrides
  redis:
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  # Nginx development overrides
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev-simple.conf:/etc/nginx/nginx.conf




