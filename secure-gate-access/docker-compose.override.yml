# Docker Compose Override for Development
# This file provides development-specific overrides for docker-compose.prod.yml

version: '3.8'

services:
  # Backend development overrides
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "5000:5000"
    command: npm run dev

  # Frontend development overrides
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      REACT_APP_ENVIRONMENT: development
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    command: npm start

  # Database development overrides
  postgres:
    environment:
      POSTGRES_DB: secure_gate_dev
    ports:
      - "5432:5432"

  # Redis development overrides
  redis:
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  # Nginx development overrides
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf




