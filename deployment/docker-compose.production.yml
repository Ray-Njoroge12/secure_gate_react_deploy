# Production Docker Compose Configuration
# Enhanced with comprehensive health checks, restart policies, and monitoring

version: '3.8'

networks:
  secure-gate-network:
    driver: bridge
    name: secure-gate-production-network

services:
  # Backend Service
  backend:
    build:
      context: ../secure-gate-access/server
      dockerfile: Dockerfile.minimal
    container_name: secure-gate-backend
    networks:
      - secure-gate-network
    environment:
      - NODE_ENV=production
      - PORT=5000
      - PGHOST=postgres
      - PGDATABASE=secure_gate
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-jwt-secret-change-me
      - JWT_REFRESH_SECRET=production-refresh-secret-change-me
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Service
  frontend:
    build:
      context: ../secure-gate-access/client
      dockerfile: Dockerfile
      args:
        - NGINX_CONFIG=nginx.conf
    container_name: secure-gate-frontend
    networks:
      - secure-gate-network
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend:5000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: secure-gate-postgres
    networks:
      - secure-gate-network
    environment:
      - POSTGRES_DB=secure_gate
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../secure-gate-access/server/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../secure-gate-access/server/src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_gate"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: secure-gate-redis
    networks:
      - secure-gate-network
    command: redis-server --appendonly yes --requirepass redis-password --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: secure-gate-nginx
    networks:
      - secure-gate-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Container Health Monitor
  health-monitor:
    image: alpine:latest
    container_name: secure-gate-health-monitor
    networks:
      - secure-gate-network
    volumes:
      - ./container-health-monitor.sh:/usr/local/bin/container-health-monitor.sh
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "
        apk add --no-cache curl bash &&
        chmod +x /usr/local/bin/container-health-monitor.sh &&
        /usr/local/bin/container-health-monitor.sh monitor
      "
    depends_on:
      - backend
      - frontend
      - postgres
      - redis
      - nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: secure-gate-postgres-data
  redis_data:
    name: secure-gate-redis-data
