# Blue Environment Configuration for Blue-Green Deployment
# This configuration deploys to the "blue" environment

version: '3.8'

networks:
  blue-network:
    driver: bridge
    name: secure-gate-blue-network

services:
  # Blue Backend Service
  backend-blue:
    build:
      context: ../secure-gate-access/server
      dockerfile: Dockerfile.minimal
    container_name: secure-gate-backend-blue
    networks:
      - blue-network
    environment:
      - NODE_ENV=production
      - PORT=5001
      - ENVIRONMENT=blue
      - PGHOST=postgres-blue
      - PGDATABASE=secure_gate_blue
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - REDIS_URL=redis://redis-blue:6379
      - JWT_SECRET=blue-jwt-secret-change-me
      - JWT_REFRESH_SECRET=blue-refresh-secret-change-me
    ports:
      - "5001:5001"
    depends_on:
      - postgres-blue
      - redis-blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Blue Frontend Service
  frontend-blue:
    build:
      context: ../secure-gate-access/client
      dockerfile: Dockerfile
      args:
        - NGINX_CONFIG=nginx.standalone.conf
    container_name: secure-gate-frontend-blue
    networks:
      - blue-network
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend-blue:5001
    ports:
      - "3001:80"
    depends_on:
      - backend-blue
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Blue PostgreSQL Database
  postgres-blue:
    image: postgres:15-alpine
    container_name: secure-gate-postgres-blue
    networks:
      - blue-network
    environment:
      - POSTGRES_DB=secure_gate_blue
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_blue_data:/var/lib/postgresql/data
      - ../secure-gate-access/server/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../secure-gate-access/server/src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_gate_blue"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Blue Redis Cache
  redis-blue:
    image: redis:7-alpine
    container_name: secure-gate-redis-blue
    networks:
      - blue-network
    command: redis-server --appendonly yes --requirepass redis-blue-password
    volumes:
      - redis_blue_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Blue Load Balancer (for internal routing)
  nginx-blue:
    image: nginx:alpine
    container_name: secure-gate-nginx-blue
    networks:
      - blue-network
    ports:
      - "8080:80"
    volumes:
      - ./nginx/blue.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend-blue
      - backend-blue
    restart: unless-stopped

volumes:
  postgres_blue_data:
    name: secure-gate-postgres-blue-data
  redis_blue_data:
    name: secure-gate-redis-blue-data
