AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secure Gate Access - HTTPS ALB Configuration with SSL/TLS'

Parameters:
  DomainName:
    Type: String
    Default: api.securegate.com
    Description: Domain name for the API endpoint
  
  CertificateArn:
    Type: String
    Description: ARN of ACM certificate (leave empty to create new)
    Default: ''
  
  ExistingALBArn:
    Type: String
    Description: ARN of existing Application Load Balancer
  
  ExistingTargetGroupArn:
    Type: String
    Description: ARN of existing Target Group

Conditions:
  CreateCertificate: !Equals [!Ref CertificateArn, '']

Resources:
  # SSL Certificate (if not provided)
  SSLCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      ValidationMethod: DNS
      Tags:
        - Key: Name
          Value: secure-gate-ssl-cert
        - Key: Project
          Value: SecureGate

  # HTTPS Listener
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ExistingALBArn
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01
      Certificates:
        - CertificateArn: !If 
          - CreateCertificate
          - !Ref SSLCertificate
          - !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ExistingTargetGroupArn

  # HTTP to HTTPS Redirect
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ExistingALBArn
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

Outputs:
  HTTPSEndpoint:
    Description: HTTPS endpoint URL
    Value: !Sub 'https://${DomainName}'
  
  CertificateArn:
    Description: SSL Certificate ARN
    Value: !If 
      - CreateCertificate
      - !Ref SSLCertificate
      - !Ref CertificateArn
