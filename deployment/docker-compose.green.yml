# Green Environment Configuration for Blue-Green Deployment
# This configuration deploys to the "green" environment

version: '3.8'

networks:
  green-network:
    driver: bridge
    name: secure-gate-green-network

services:
  # Green Backend Service
  backend-green:
    build:
      context: ../secure-gate-access/server
      dockerfile: Dockerfile
    container_name: secure-gate-backend-green
    networks:
      - green-network
    environment:
      - NODE_ENV=production
      - PORT=5001
      - ENVIRONMENT=green
      - PGHOST=postgres-green
      - PGDATABASE=secure_gate_green
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - REDIS_URL=redis://redis-green:6379
      - JWT_SECRET=Ro$$Z"3BY*ZCyc.VhI)e*zmehDGd$$IgF+xy2QNjH5U-1GdiwLobRv/8..HkCqk5(T
      - JWT_REFRESH_SECRET=G#VzJ8k/*xUqLcOIUuHJjA(m,,yBT#GRBU0Ob.PHk-z1a.srWSE7IRvtAat.yoh3
      - SESSION_SECRET=v'kzgi%h$$x,qipmDeg(UIr$$mbc66*.yoPs#D&H3',28X3R'Flq8s7Us&YF7Kd1BR
      - ALLOW_HTTP_IN_PRODUCTION=true
      - SECURE_COOKIES=true
    ports:
      - "5002:5001"
    depends_on:
      - postgres-green
      - redis-green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Green Frontend Service
  frontend-green:
    build:
      context: ../secure-gate-access/client
      dockerfile: Dockerfile
      args:
        - NGINX_CONFIG=nginx.standalone.conf
    container_name: secure-gate-frontend-green
    networks:
      - green-network
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://backend-green:5001
    ports:
      - "3002:80"
    depends_on:
      - backend-green
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Green PostgreSQL Database
  postgres-green:
    image: postgres:15-alpine
    container_name: secure-gate-postgres-green
    networks:
      - green-network
    environment:
      - POSTGRES_DB=secure_gate_green
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_green_data:/var/lib/postgresql/data
      - ../secure-gate-access/server/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../secure-gate-access/server/src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_gate_green"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Green Redis Cache
  redis-green:
    image: redis:7-alpine
    container_name: secure-gate-redis-green
    networks:
      - green-network
    command: redis-server --appendonly yes --requirepass redis-green-password
    volumes:
      - redis_green_data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Green Load Balancer (for internal routing)
  nginx-green:
    image: nginx:alpine
    container_name: secure-gate-nginx-green
    networks:
      - green-network
    ports:
      - "8081:80"
    volumes:
      - ./nginx/green.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend-green
      - backend-green
    restart: unless-stopped

volumes:
  postgres_green_data:
    name: secure-gate-postgres-green-data
  redis_green_data:
    name: secure-gate-redis-green-data
