    context_files:
      - secure-gate-access/server/package.json: test:smoke script
      - secure-gate-access/server/tests/smoke/01-basic-smoke.test.js: smoke expectations
      - secure-gate-access/server/src/routes/healthRoutes.js: health contract under test
    estimated_effort: small
    estimated_files: 1
    estimated_lines: 120
    focus_area: core_functional
    verification:
      - cd secure-gate-access/server && npm run test:smoke > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/core_functional/01-smoke.log 2>&1
    acceptance_criteria:
      - Smoke log exists at artifacts/core_functional/01-smoke.log.
      - Pass/fail outcome is explicit with suite/test counts and non-zero exit evidence on failure.
    failure_modes:
      - scenario: Smoke tests fail due to endpoint contract drift.
        likelihood: medium
        impact: high
        mitigation: Classify as smoke_regression with failing assertions and related endpoint identifiers.
    environment: development
    requires_approval: false
    security_sensitive: false

  - id: CF-002
    title: core_functional critical integration gate verification
    description: |
      Execute test:critical to validate auth refresh/logout, invite lifecycle,
      estate scoping, webhook signature, and notification retry critical paths.
    wave: 4
    agent: gem-devops
    priority: high
    status: completed
    dependencies:
