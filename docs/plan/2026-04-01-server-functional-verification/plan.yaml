      - cd secure-gate-access/server && npm run test:critical > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/core_functional/02-critical.log 2>&1
    acceptance_criteria:
      - Critical suite log exists at artifacts/core_functional/02-critical.log.
      - Pass/fail evidence includes failed suite names and first failure stack when applicable.
      - DB dependency failures are explicitly separated into blocker_db vs application regression.
    failure_modes:
      - scenario: Critical suites fail because integration DB cannot initialize.
