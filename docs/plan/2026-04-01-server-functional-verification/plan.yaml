tasks:
  - id: FS-001
    title: fast_sanity preflight blockers and baseline
    description: |
      Validate environment and listener prerequisites before runtime execution.
      Classify blockers into taxonomy categories: blocker_env, blocker_db, blocker_port.
      Do not fix blockers; record evidence and propagate blocked/degraded state.
    wave: 1
    agent: gem-devops
    priority: high
    status: completed
    dependencies: []
    context_files:
      - secure-gate-access/server/package.json: canonical command inventory
      - secure-gate-access/server/src/config/environment.js: env validation behavior
      - docs/plan/2026-04-01-server-functional-verification/research_findings_server-functional-verification.yaml: blocker constraints
    estimated_effort: small
    estimated_files: 2
    estimated_lines: 120
    focus_area: fast_sanity
    verification:
      - mkdir -p docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity
      - cd secure-gate-access/server && node -v > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/01-node-version.txt
      - cd secure-gate-access/server && npm run validate:env > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/01-validate-env.log 2>&1
      - lsof -nP -iTCP:3001 -sTCP:LISTEN > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/01-port-3001.log 2>&1 || true
      - lsof -nP -iTCP:5001 -sTCP:LISTEN > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/01-port-5001.log 2>&1 || true
    acceptance_criteria:
      - Preflight logs exist: artifacts/fast_sanity/01-node-version.txt, artifacts/fast_sanity/01-validate-env.log, artifacts/fast_sanity/01-port-3001.log, artifacts/fast_sanity/01-port-5001.log.
      - blocker_matrix artifact created at artifacts/fast_sanity/01-blocker-matrix.yaml with explicit status for env/db/ports.
      - Pass evidence is explicit (all required checks passed) and fail evidence includes first failing command + stderr excerpt.
    failure_modes:
      - scenario: validate:env fails because required secrets or config are missing.
        likelihood: medium
        impact: high
        mitigation: Classify as blocker_env, mark downstream runtime tasks blocked/degraded, continue non-runtime evidence collection.
      - scenario: Required verification port is already occupied.
        likelihood: medium
        impact: medium
        mitigation: Classify as blocker_port, capture listener process evidence, attempt agreed fallback policy only (no code/config fixes).
    environment: development
    requires_approval: false
    security_sensitive: true

  - id: FS-002
    title: fast_sanity startup and health probe verification
    description: |
      Start the server in controlled mode, capture startup logs and PID, and probe core health endpoints.
      Health probes must emit explicit HTTP status and response body evidence for pass/fail analysis.
    wave: 2
    agent: gem-devops
    priority: high
    status: completed
    dependencies:
      - FS-001
    context_files:
      - secure-gate-access/server/server.js: startup behavior and port handling
      - secure-gate-access/server/src/routes/healthRoutes.js: health endpoint expectations
      - secure-gate-access/server/src/routes/domains/system.domain.js: /health and /api/health mounting
    estimated_effort: medium
    estimated_files: 3
    estimated_lines: 200
    focus_area: fast_sanity
    verification:
      - cd secure-gate-access/server && PORT=3001 npm start > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/02-startup.log 2>&1 & echo $! > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/02-server.pid
      - sleep 12
      - curl -sS -i http://localhost:3001/health > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/02-health-root.http
      - curl -sS -i http://localhost:3001/api/health > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/02-health-api.http
      - curl -sS -i http://localhost:3001/health/live > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/02-health-live.http
      - curl -sS -i http://localhost:3001/health/ready > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/02-health-ready.http
    acceptance_criteria:
      - Startup evidence exists: artifacts/fast_sanity/02-startup.log and artifacts/fast_sanity/02-server.pid.
      - Health probe evidence exists with explicit status lines and payloads: artifacts/fast_sanity/02-health-root.http, artifacts/fast_sanity/02-health-api.http, artifacts/fast_sanity/02-health-live.http, artifacts/fast_sanity/02-health-ready.http.
      - Pass/fail statement recorded with expected status behavior (/health and /api/health must be reachable; /health/ready may be 200 or 503 and must be classified, not ignored).
    failure_modes:
      - scenario: Server fails to start due to DB initialization failure.
        likelihood: medium
        impact: critical
        mitigation: Classify as blocker_db if dependency-related; otherwise classify as startup_failure with stack trace evidence.
      - scenario: Health endpoints return unexpected status or malformed payload.
        likelihood: medium
        impact: high
        mitigation: Classify as health_contract_failure and preserve full HTTP response evidence.
    environment: development
    requires_approval: false
    security_sensitive: true

  - id: FS-003
    title: fast_sanity stop and restart verification
    description: |
      Validate graceful stop and restart behavior using captured PID and explicit signal handling.
      Confirm listener release and successful post-restart health response.
    wave: 3
    agent: gem-devops
    priority: high
    status: completed
    dependencies:
      - FS-002
    context_files:
      - secure-gate-access/server/server.js: graceful shutdown logic
      - secure-gate-access/server/src/app.js: additional signal handling
      - secure-gate-access/server/src/database/db.enhanced.js: DB shutdown hooks
    estimated_effort: medium
    estimated_files: 3
    estimated_lines: 220
    focus_area: fast_sanity
    verification:
      - kill -SIGTERM "$(cat docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/02-server.pid)"
      - sleep 8
      - lsof -nP -iTCP:3001 -sTCP:LISTEN > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/03-post-stop-port.log 2>&1 || true
      - cd secure-gate-access/server && PORT=3001 npm start > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/03-restart.log 2>&1 & echo $! > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/03-server.pid
      - sleep 12
      - curl -sS -i http://localhost:3001/health > docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/03-restart-health.http
      - kill -SIGTERM "$(cat docs/plan/2026-04-01-server-functional-verification/artifacts/fast_sanity/03-server.pid)"
    acceptance_criteria:
      - Stop evidence exists: artifacts/fast_sanity/03-post-stop-port.log showing listener release result.
      - Restart evidence exists: artifacts/fast_sanity/03-restart.log, artifacts/fast_sanity/03-server.pid, and artifacts/fast_sanity/03-restart-health.http.
      - Pass/fail evidence explicitly states whether stop and restart succeeded independently.
    failure_modes:
      - scenario: SIGTERM does not stop server cleanly and listener remains bound.
        likelihood: low
        impact: high
        mitigation: Classify as shutdown_failure and capture lingering process/listener evidence.
      - scenario: Restart succeeds but health probe fails.
        likelihood: medium
        impact: high
        mitigation: Classify as startup_failure or health_contract_failure based on startup log and HTTP evidence.
    environment: development
    requires_approval: false
    security_sensitive: true

  - id: CF-001
    title: core_functional smoke suite verification
    description: |
      Run smoke tests through npm script and capture deterministic output.
      No retries unless failure is explicitly classified as flaky_or_nondeterministic.
    wave: 4
    agent: gem-devops
    priority: high
    status: completed
    dependencies:
