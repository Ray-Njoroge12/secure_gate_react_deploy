      - scenario: Broad integration regressions appear after critical suite passed.
        likelihood: medium
        impact: high
        mitigation: Classify as integration_regression and capture differential against critical results.
    environment: development
    requires_approval: false
    security_sensitive: true

  - id: DC-002
    title: deep_confidence pass fail evidence normalization and failure taxonomy
    description: |
      Normalize all collected artifacts into a single pass/fail matrix and classify each failure.
      Required taxonomy: blocker_env, blocker_db, blocker_port, startup_failure,
      shutdown_failure, health_contract_failure, smoke_regression,
      critical_regression, unit_regression, integration_regression,
      flaky_or_nondeterministic, inconclusive.
    wave: 6
    agent: gem-reviewer
    priority: high
    status: completed
    dependencies:
      - FS-001
      - FS-002
      - FS-003
      - CF-001
      - CF-002
      - CF-003
      - DC-001
    context_files:
      - docs/plan/2026-04-01-server-functional-verification/artifacts: collected evidence inputs
      - docs/plan/2026-04-01-server-functional-verification/research_findings_server-functional-verification.yaml: taxonomy constraints
      - secure-gate-access/server/package.json: expected command surface for verification matrix
    estimated_effort: medium
    estimated_files: 2
    estimated_lines: 240
    focus_area: deep_confidence
    verification:
      - Build matrix artifact at docs/plan/2026-04-01-server-functional-verification/artifacts/deep_confidence/02-pass-fail-matrix.yaml
      - Build taxonomy artifact at docs/plan/2026-04-01-server-functional-verification/artifacts/deep_confidence/02-failure-taxonomy.yaml
      - Ensure every failed or blocked task has evidence pointer(s) to concrete artifact paths
    acceptance_criteria:
      - Pass/fail matrix includes each planned task with status passed|failed|blocked|inconclusive and artifact pointers.
      - Failure taxonomy file classifies each failure exactly once with rationale and source evidence path.
      - Blockers are separated from regressions and do not collapse into generic failure labels.
    failure_modes:
      - scenario: Classification merges blocker and regression causes, reducing diagnostic value.
        likelihood: medium
        impact: high
        mitigation: Enforce one-primary-cause rule per failed task with secondary notes only.
      - scenario: Missing artifact links make failures non-reproducible.
        likelihood: low
        impact: high
