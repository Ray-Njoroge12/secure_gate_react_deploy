plan_id: 2026-04-01-server-functional-verification
objective: Run thorough server verification (startup, stop, health, smoke, critical/unit/integration tests), identify failures/bugs, no fixes.
created_at: 2026-04-01T00:00:00Z
created_by: gem-planner
status: completed
research_confidence: medium

tldr: |
  Execute a three-phase verification DAG: fast_sanity (preflight/start/stop/health),
  core_functional (smoke + critical + unit), and deep_confidence (integration +
  taxonomy + final report). Every task emits explicit pass/fail evidence artifacts.
  Blockers are classified as env/db/ports and propagated so downstream tasks are
  marked blocked or degraded instead of silently skipped.

open_questions:
  - Should admin-token-gated endpoints (for example /health/detailed and /api/system/database/health) be mandatory or optional when admin credentials are unavailable?
  - If port 3001 is occupied but 5001 is free, should runtime verification proceed on 5001 as degraded-success or be classified as a hard blocker?

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Verification appears green because runtime probes target the wrong port while server is running elsewhere.
      likelihood: medium
      impact: high
      mitigation: Force explicit PORT assignment, capture listener evidence with lsof, and store probe URL in artifacts.
    - scenario: Integration and critical suites fail due to DB provisioning issues, masking application-level behavior.
      likelihood: medium
      impact: critical
      mitigation: Classify DB blockers separately from test regressions and preserve full failure logs with first-error signatures.
    - scenario: Startup and shutdown handlers produce inconsistent behavior across signal paths and leave orphaned listeners.
      likelihood: low
      impact: high
      mitigation: Record PID, signal used, post-stop port checks, and restart outcome as mandatory evidence.
  assumptions:
    - Node and npm are available in the workspace shell.
    - PostgreSQL test/runtime dependencies may be unavailable and must be treated as explicit blockers, not fixed in this plan.
    - Verification can write artifacts under docs/plan/2026-04-01-server-functional-verification/artifacts.

implementation_specification:
  code_structure: Non-code verification workflow driven by shell commands and npm scripts, with evidence artifacts organized by phase under docs/plan/2026-04-01-server-functional-verification/artifacts and a final report under docs/plan/2026-04-01-server-functional-verification.
  affected_areas:
    - docs/plan/2026-04-01-server-functional-verification/plan.yaml
    - secure-gate-access/server/package.json
    - secure-gate-access/server/server.js
  component_details:
    - component: fast_sanity verifier
      responsibility: Validate environment and port prerequisites, execute startup/health probes, and verify graceful stop/restart behavior.
      interfaces:
        - npm run validate:env
        - PORT=3001 npm start
        - curl probes for /health, /api/health, /health/live, /health/ready
    - component: core_functional test executor
      responsibility: Run smoke, critical, and unit suites with explicit pass/fail capture.
      interfaces:
        - npm run test:smoke
        - npm run test:critical
        - npm run test:unit
    - component: deep_confidence executor
      responsibility: Run integration suite and capture full regression evidence for high-confidence validation.
      interfaces:
        - npm run test:integration
    - component: evidence classifier and reporter
      responsibility: Normalize results into pass/fail matrix and failure taxonomy, then produce final summary of confirmed functionality and failure points.
      interfaces:
        - blocker + failure taxonomy schema
        - final verification report artifact
  dependencies:
    - component: secure-gate-access/server/package.json scripts
      relationship: Provides canonical verification commands for startup and tests.
    - component: secure-gate-access/server/src/routes/healthRoutes.js
      relationship: Serves health endpoints used by fast_sanity probes.
    - component: secure-gate-access/server/tests/integration/setup.js
      relationship: Governs integration DB bootstrap behavior and blocker diagnosis.
  integration_points:
    - Startup entry through secure-gate-access/server/server.js using npm start
    - Health probes through /health and /api/health route mounts
    - Jest suite execution through server npm scripts with ESM flags
    - Evidence and report generation in docs/plan/2026-04-01-server-functional-verification

