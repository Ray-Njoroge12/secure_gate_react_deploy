  - id: CF-003
    title: core_functional unit suite verification
    description: |
      Execute unit suite using canonical npm script and capture output for pass/fail analysis.
    wave: 4
    agent: gem-devops
    priority: medium
    status: completed
    dependencies:
      - FS-003
    context_files:
      - secure-gate-access/server/package.json: test:unit script
      - secure-gate-access/server/tests/unit: unit test scope
    estimated_effort: medium
    estimated_files: 1
    estimated_lines: 150
    focus_area: core_functional
    verification:
      - cd secure-gate-access/server && npm run test:unit > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/core_functional/03-unit.log 2>&1
    acceptance_criteria:
      - Unit suite log exists at artifacts/core_functional/03-unit.log.
      - Pass/fail evidence includes total suites/tests and first-error signature on failure.
    failure_modes:
      - scenario: Unit suite hits memory/time instability and aborts without deterministic result.
        likelihood: low
        impact: medium
        mitigation: Classify as flaky_or_nondeterministic only if reproduced inconsistency is demonstrated; otherwise classify as unit_regression.
    environment: development
    requires_approval: false
    security_sensitive: false

  - id: DC-001
    title: deep_confidence full integration suite verification
    description: |
      Execute full integration suite after core functional evidence is collected.
      Capture complete output to confirm or refute broad backend confidence.
    wave: 5
    agent: gem-devops
    priority: high
    status: completed
    dependencies:
      - CF-001
      - CF-002
      - CF-003
    context_files:
      - secure-gate-access/server/package.json: test:integration script
      - secure-gate-access/server/tests/integration/setup.js: integration bootstrap
      - secure-gate-access/docs/testing/integration/guide.md: integration assumptions
    estimated_effort: large
    estimated_files: 1
    estimated_lines: 260
    focus_area: deep_confidence
    verification:
      - mkdir -p docs/plan/2026-04-01-server-functional-verification/artifacts/deep_confidence
      - cd secure-gate-access/server && npm run test:integration > ../../docs/plan/2026-04-01-server-functional-verification/artifacts/deep_confidence/01-integration.log 2>&1
    acceptance_criteria:
      - Integration log exists at artifacts/deep_confidence/01-integration.log.
      - Pass/fail evidence includes explicit suite counts, failure list, and setup-stage failure extraction when blocked.
