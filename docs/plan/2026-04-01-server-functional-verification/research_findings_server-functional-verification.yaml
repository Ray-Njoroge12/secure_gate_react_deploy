related_conventions:
  naming_patterns_in_domain: npm scripts use grouped prefixes (test:*, db:*, setup:*); health endpoints use probe-style naming (/live, /ready, /startup, /detailed).
  structure_of_domain: Startup orchestration in server.js, app wiring in src/app.js, route domains in src/routes/domains, and specialized route handlers in src/routes.
  error_handling_in_domain: Startup and dependency failures emit explicit console diagnostics and use process.exit(1) for blocking states.
  testing_in_domain: Integration harness forces NODE_ENV=test and secure_gate_test DB, with transaction/cleanup helpers in tests/integration/setup.js.
  documentation_in_domain: Active operational references are in documentation/guides and secure-gate-access/docs/testing; archive docs contain historical variants.

