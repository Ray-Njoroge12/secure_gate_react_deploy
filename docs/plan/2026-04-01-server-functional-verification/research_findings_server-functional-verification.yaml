patterns_found:
  - category: structure
    pattern: Multi-layer startup validation before server listen
    description: Startup path validates environment, checks port availability, initializes DB/migrations, then starts HTTP and optional services.
    examples:
      - file: secure-gate-access/server/server.js
        location: secure-gate-access/server/server.js:320
        snippet: "startServer() resolves port, runs dbManager.initializeAsync(), migrationService.runMigrations(), then app.listen()"
      - file: secure-gate-access/server/src/config/environment.js
        location: secure-gate-access/server/src/config/environment.js:284
        snippet: "Production-specific validation errors are collected and can block startup"
    prevalence: common

  - category: architecture
    pattern: Dual health route mounting for public and API-prefixed probes
    description: Same health router is mounted under /health and /api/health for infrastructure and API clients.
    examples:
      - file: secure-gate-access/server/src/routes/domains/system.domain.js
        location: secure-gate-access/server/src/routes/domains/system.domain.js:17
        snippet: "{ prefix: '/health', router: healthRoutes } and { prefix: '/api/health', router: healthRoutes }"
    prevalence: common

  - category: error_handling
    pattern: Explicit startup-blocking failures with actionable console hints
    description: Invalid port, missing JWT secrets, DB failures, and production config violations emit targeted diagnostics then exit.
    examples:
      - file: secure-gate-access/server/server.js
        location: secure-gate-access/server/server.js:69
        snippet: "Server startup blocked - invalid PORT value"
      - file: secure-gate-access/server/server.js
        location: secure-gate-access/server/server.js:356
        snippet: "Server startup blocked - database connection required"
      - file: secure-gate-access/server/src/services/tokenService.js
        location: secure-gate-access/server/src/services/tokenService.js:18
        snippet: "CRITICAL: JWT secrets not configured"
    prevalence: common

  - category: testing
    pattern: ESM-safe Jest invocation through npm scripts with environment forcing
    description: Test scripts force NODE_ENV=test, NODE_NO_WARNINGS=1, and vm-modules execution to maintain compatibility.
    examples:
      - file: secure-gate-access/server/package.json
        location: secure-gate-access/server/package.json:10
        snippet: "NODE_ENV=test NODE_NO_WARNINGS=1 node --experimental-vm-modules ..."
      - file: secure-gate-access/server/tests/integration/setup.js
        location: secure-gate-access/server/tests/integration/setup.js:20
        snippet: "process.env.PGDATABASE = 'secure_gate_test'"
    prevalence: common

  - category: structure
    pattern: Redis optionality with memory fallback
    description: Session/token/cache paths treat Redis as optional and continue with reduced durability when unavailable.
    examples:
