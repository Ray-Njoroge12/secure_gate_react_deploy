open_questions:
  - question: Which port should be treated as canonical for this session verification run (3001 from .env.example/.smoke defaults vs 5001 development fallback in server.js when PORT is unset)?
    context: Startup and smoke docs/scripts assume different defaults, affecting command reproducibility.
  - question: Is app-level gracefulShutdownHandler wiring in src/app.js intentionally registered with process signals directly, despite handler signature expecting server instance?
    context: Current shape suggests potential signal-time TypeError path distinct from server.js shutdown handler.
  - question: Should /health/deep be considered active for operations checks?
    context: Ops docs mention deep/internal health path, but route definitions expose /health/detailed and no /deep endpoint.

gaps:
  - area: Runtime confirmation of shutdown log ordering across multiple signal handlers
    description: Multiple modules register SIGTERM/SIGINT handlers; this research verified definitions but did not execute stop path in-session.
    impact: Exact stop-sequence observability and dominant handler behavior remain unverified without execution.
  - area: Active documentation authority split
    description: Some guides and scripts use divergent assumptions (base URL/port and endpoint variants).
    impact: Verification operators may need to normalize commands before execution to avoid false negatives.
