implementation_specification:
  code_structure: |
    Cleanup operations organized by risk level and dependency:
    - Wave 1: Safe deletions (no dependencies, verified unused)
    - Wave 2: Archive operations (preserve historical context)
    - Wave 3: Bug fix (isolated change with clear scope)
    - Wave 4: Consolidation (move and update imports)
    - Wave 5: Directory cleanup (remove empty structures)
  affected_areas:
    - secure-gate-access/server/scripts/ (debug and migration scripts)
    - secure-gate-access/server/tests/unit/ (zombie tests)
    - production-readiness-tests/ (milestone archive)
    - disaster-recovery-validation/, privacy-validation/, performance-validation/ (consolidation)
    - compliance_audits/ (empty directory removal)
    - archive/scripts/debug/ (archive destination)
  component_details:
    - component: Debug Script Removal
      responsibility: Remove 10 debug/repro scripts verified as unused
      interfaces:
        - No external interfaces - standalone scripts
    - component: Historical Script Archive
      responsibility: Preserve 3 scripts with historical/diagnostic value
      interfaces:
        - Move to archive/scripts/debug/ with README
    - component: Test Zombie Cleanup
      responsibility: Remove tests for non-existent services
      interfaces:
        - No service dependencies - tests reference phantom services
    - component: Migration Bug Fix
      responsibility: Fix table name reference in migrate-qr-codes.js
      interfaces:
        - Database schema (qr_tokens table)
    - component: Validation Test Consolidation
      responsibility: Move scattered validation tests to server/tests/
      interfaces:
        - Jest test runner configuration
        - Relative import paths
  dependencies:
    - component: Wave 2 (Archive)
      relationship: Depends on Wave 1 completion for clean state verification
    - component: Wave 4 (Consolidation)
      relationship: Depends on Wave 3 (bug fix) to ensure clean baseline
    - component: Wave 5 (Directory Cleanup)
      relationship: Depends on all file operations complete
  integration_points:
    - Git repository (all changes tracked via commits per wave)
    - Jest test configuration (may need path updates for consolidated tests)
    - Archive directory structure (documentation/archive/milestone-validation/)

