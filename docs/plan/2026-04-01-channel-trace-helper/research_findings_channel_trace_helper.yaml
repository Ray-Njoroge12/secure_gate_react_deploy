related_conventions:
  naming_patterns_in_domain: Channel fallback traces use `attempts` (messaging) and `deliveryTrace` (performance alerting); metric events use `notification_result` and `delivery_event` type names.
  structure_of_domain: Producer services in `src/services`, route-level persistence in `src/routes`, long-term schema in migration SQL, and operational logs in `server/logs`.
  error_handling_in_domain: Services log structured failures via loggingService; route handlers wrap with async handlers and explicit 4xx/5xx response helpers.
  testing_in_domain: Unit tests exercise performance alerting behavior and generate reproducible alert log entries in test runs.
  documentation_in_domain: No dedicated channel-trace helper documentation currently found under docs/plan for this plan id.

related_dependencies:
  internal:
    - component: secure-gate-access/server/src/services/loggingService.js
      relationship_to_domain: Receives and formats attempt trace metadata into persistent logs.
      direction: outbound
    - component: secure-gate-access/server/src/services/notificationMetricsService.js
      relationship_to_domain: Receives notification result events from messaging and provider flows.
      direction: outbound
    - component: secure-gate-access/server/src/database/db.enhanced.js
      relationship_to_domain: Persists metrics event payloads and delivery status updates.
      direction: outbound
    - component: secure-gate-access/server/src/services/monitoringDashboardService.js
      relationship_to_domain: Consumes notification metrics outputs for admin dashboards.
      direction: inbound
  external:
    - name: winston
      purpose_for_domain: Structured JSON logs with metadata payloads for triage extraction.
    - name: pg
      purpose_for_domain: SQL persistence for notification metrics and delivery event tables.

domain_security_considerations:
  sensitive_areas:
    - area: Recipient/contact data in trace metadata
      location: secure-gate-access/server/src/services/messagingGateway.js:36
      concern: Logs can include phone/email recipient identifiers if not masked at call site.
    - area: Metrics metadata persistence
      location: secure-gate-access/server/src/services/notificationMetricsService.js:26
      concern: Service sanitizes likely PII keys, but helper scripts must still avoid re-exposing raw payloads unnecessarily.
  authentication_patterns_in_domain: Monitoring/health alert endpoints require authenticated admin policies (adminOnly).
  authorization_patterns_in_domain: `/health/alerts` and `/api/monitoring/*` route stacks enforce role policy middleware.
  data_validation_in_domain: Webhook routes validate signatures and schema before writing delivery metadata/events.

testing_patterns:
  framework: Jest
  coverage_areas:
    - Performance alert processing and notification channel failure behavior
    - Notification webhook event/status handling
  test_organization: Unit tests under secure-gate-access/server/tests/unit and route/integration tests under secure-gate-access/server/tests/integration.
  mock_patterns:
    - Mocked email sender failures generate structured alerting error logs used in current evidence.

open_questions:
  - question: Should helper output normalize both `attempts` and `deliveryTrace` under one key (e.g., `attemptTraces`)?
    context: Current codebase uses two active names; no literal `attemptTraces` field exists.
  - question: Should channel-attempt traces be persisted in DB as first-class records or remain log-derived?
    context: Logs contain full fallback sequence; DB currently stores outcomes/events but not complete attempt chain.

gaps:
  - area: First-class DB persistence of fallback attempt sequences
    description: No active table currently stores MessagingGateway `attempts[]` as a dedicated normalized structure for querying.
    impact: Report helper must parse logs for full channel-attempt timelines.
  - area: Existing helper tooling for this exact triage use case
    description: No pre-existing `channel trace` helper script or plan artifact was found under docs/plan/2026-04-01-channel-trace-helper.
    impact: A new helper script is required to automate extraction and summarization.
