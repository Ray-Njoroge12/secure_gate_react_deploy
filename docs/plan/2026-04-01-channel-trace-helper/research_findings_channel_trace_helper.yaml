patterns_found:
  - category: architecture
    pattern: Channel fallback traces are produced in-memory and attached to logging payloads.
    description: MessagingGateway accumulates per-channel attempts then emits structured logs on total failure or fallback success.
    examples:
      - file: secure-gate-access/server/src/services/messagingGateway.js
        location: secure-gate-access/server/src/services/messagingGateway.js:35
        snippet: const attempts = []
      - file: secure-gate-access/server/src/services/messagingGateway.js
        location: secure-gate-access/server/src/services/messagingGateway.js:91
        snippet: loggingService.logError('MessagingGateway: All channels failed', null, { ..., attempts })
      - file: secure-gate-access/server/logs/app-error.log
        location: secure-gate-access/server/logs/app-error.log:727
        snippet: "metadata":{"attempts":[{"channel":"whatsapp",...},{"channel":"sms",...}]}
    prevalence: common

  - category: structure
    pattern: Performance alerting uses separate delivery tracing (`deliveryTrace`) from messaging gateway attempts.
    description: Alert channel send flow records per-channel/per-recipient status and emits warning/error logs when failures occur.
    examples:
      - file: secure-gate-access/server/src/services/performanceAlertingService.js
        location: secure-gate-access/server/src/services/performanceAlertingService.js:176
        snippet: const deliveryTrace = []
      - file: secure-gate-access/server/src/services/performanceAlertingService.js
        location: secure-gate-access/server/src/services/performanceAlertingService.js:241
        snippet: const attempted = deliveryTrace.filter(item => item.status !== 'skipped').length
    prevalence: common

  - category: architecture
    pattern: DB persistence favors event/outcome storage over full fallback attempt sequences.
    description: notification metrics and webhook tables store event payloads/status transitions, but no direct first-class schema for gateway `attempts[]` sequences.
    examples:
      - file: secure-gate-access/server/src/services/notificationMetricsService.js
        location: secure-gate-access/server/src/services/notificationMetricsService.js:124
        snippet: INSERT INTO notification_metrics_events (..., payload, ...)
      - file: secure-gate-access/server/src/routes/notificationWebhooks.js
        location: secure-gate-access/server/src/routes/notificationWebhooks.js:230
        snippet: delivery_metadata = delivery_metadata || $4::jsonb
      - file: secure-gate-access/server/src/database/migrations/048_intelligent_notification_system.sql
        location: secure-gate-access/server/src/database/migrations/048_intelligent_notification_system.sql:152
        snippet: CREATE TABLE IF NOT EXISTS notification_channel_performance (... total_attempts ...)
    prevalence: common

