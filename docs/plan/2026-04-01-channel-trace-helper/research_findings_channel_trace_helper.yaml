plan_id: 2026-04-01-channel-trace-helper
objective: Identify where channel-attempt trace data is produced, where alerting/messaging paths expose it, and where a minimal triage helper should live.
focus_area: server notification channel-attempt tracing and monitoring surfaces
created_at: 2026-04-01T00:00:00Z
created_by: gem-researcher
status: completed

tldr: |
  - No literal `attemptTraces` symbol exists; active trace fields are `attempts` in MessagingGateway and `deliveryTrace` in PerformanceAlertingService.
  - MessagingGateway is the canonical producer of per-channel attempt arrays and writes those arrays into structured logs for all-channel failure and fallback flows.
  - Performance alerting builds a separate per-channel `deliveryTrace` and logs failed-recipient details; this trace is not persisted to DB history.
  - The strongest triage data source today for channel-attempt detail is log files (`server/logs/app*.log`) where `metadata.attempts[]` is present.
  - Existing DB persistence (`notification_metrics_events`, `notifications.delivery_metadata`, `notification_delivery_events`) captures outcomes and provider events, but not full fallback attempt sequences.

research_metadata:
  methodology: Two-pass hybrid retrieval (semantic_search + grep_search), targeted relationship discovery via symbol usages, then focused read_file inspection of producers, consumers, migrations, and runtime logs.
  scope: Notification and performance-alerting paths in secure-gate-access/server plus relevant migrations, monitoring routes, and runtime logs.
  confidence: high
  coverage: 90

