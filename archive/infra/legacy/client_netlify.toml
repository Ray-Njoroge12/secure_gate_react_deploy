[build]
  command = "npm run build"
  publish = "build"

# Proxy /api requests to the backend (Replace URL after deploying backend)
[[redirects]]
  from = "/api/*"
  to = "https://secure-gate-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Catch-all for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
