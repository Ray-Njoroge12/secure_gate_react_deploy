[build]
  publish = "."

# API proxy to backend in af-south-1 for ODPC compliance
[[redirects]]
  from = "/api/*"
  to = "http://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
