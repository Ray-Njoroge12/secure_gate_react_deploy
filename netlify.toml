# Netlify Configuration for Secure Gate Frontend
# This file should be at the repository root

[build]
  base = "secure-gate-access/client"
  publish = "build"
  command = "npm run build:production"

# API Proxy - Forward API requests to backend
[[redirects]]
  from = "/api/*"
  to = "https://secure-gate-api.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "netlify"}

# SPA fallback - All routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  CI = "false"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.google-analytics.com; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; connect-src 'self' https://secure-gate-api.onrender.com wss://secure-gate-api.onrender.com https://www.google-analytics.com; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
