[build]
  publish = "."

# API proxy to backend in af-south-1 for ODPC compliance
# Remove /api prefix and forward to backend root
# ✅ SECURITY: Now using HTTPS for all backend communication
[[redirects]]
  from = "/api/auth/*"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/api/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/register"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/register"
  status = 200
  force = true

[[redirects]]
  from = "/api/login"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/login"
  status = 200
  force = true

[[redirects]]
  from = "/api/profile"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/profile"
  status = 200
  force = true

[[redirects]]
  from = "/api/users/*"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/api/users/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/users"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/api/users"
  status = 200
  force = true

[[redirects]]
  from = "/api/visitors/*"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/api/visitors/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/mfa/*"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/api/mfa/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
