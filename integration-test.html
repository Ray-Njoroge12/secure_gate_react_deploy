<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .loading { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔗 Frontend-Backend Integration Test</h1>
    <p><strong>Frontend:</strong> Netlify (https://ephemeral-malasada-49b47b.netlify.app/)</p>
    <p><strong>Backend:</strong> AWS ALB af-south-1 (http://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com)</p>
    
    <button onclick="testDirectBackend()">Test Direct Backend</button>
    <button onclick="testViaNetlify()">Test Via Netlify Proxy</button>
    <button onclick="testAllEndpoints()">Test All Endpoints</button>
    
    <div id="results"></div>

    <script>
        const BACKEND_URL = 'http://secure-gate-alb-148297441.af-south-1.elb.amazonaws.com';
        const NETLIFY_URL = 'https://ephemeral-malasada-49b47b.netlify.app';
        
        function addResult(title, status, message, data = null) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${status}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <p><strong>Status:</strong> ${status.toUpperCase()}</p>
                <p><strong>Message:</strong> ${message}</p>
                ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
                <small><em>Time: ${new Date().toLocaleTimeString()}</em></small>
            `;
            resultsDiv.appendChild(resultDiv);
        }
        
        async function testDirectBackend() {
            addResult('Direct Backend Test', 'loading', 'Testing direct connection to backend...');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/test`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('✅ Direct Backend Success', 'success', 'Backend is responding correctly', data);
                } else {
                    addResult('❌ Direct Backend Failed', 'error', `HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                addResult('❌ Direct Backend Error', 'error', `Connection failed: ${error.message}`);
            }
        }
        
        async function testViaNetlify() {
            addResult('Netlify Proxy Test', 'loading', 'Testing connection via Netlify proxy...');
            
            try {
                const response = await fetch(`${NETLIFY_URL}/api/test`, {
                    method: 'GET'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('✅ Netlify Proxy Success', 'success', 'Frontend-Backend integration working!', data);
                } else {
                    addResult('❌ Netlify Proxy Failed', 'error', `HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                addResult('❌ Netlify Proxy Error', 'error', `Connection failed: ${error.message}`);
            }
        }
        
        async function testAllEndpoints() {
            const endpoints = ['/health', '/api/test', '/api/status'];
            
            for (const endpoint of endpoints) {
                addResult(`Testing ${endpoint}`, 'loading', `Testing direct backend endpoint: ${endpoint}`);
                
                try {
                    const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                        method: 'GET',
                        mode: 'cors'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        addResult(`✅ ${endpoint} Success`, 'success', 'Endpoint responding correctly', data);
                    } else {
                        addResult(`❌ ${endpoint} Failed`, 'error', `HTTP ${response.status}: ${response.statusText}`);
                    }
                } catch (error) {
                    addResult(`❌ ${endpoint} Error`, 'error', `Connection failed: ${error.message}`);
                }
                
                // Small delay between requests
                await new Promise(resolve => setTimeout(resolve, 500));
            }
        }
        
        // Auto-run tests on page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                testDirectBackend();
                setTimeout(() => testViaNetlify(), 2000);
            }, 1000);
        });
    </script>
</body>
</html>
